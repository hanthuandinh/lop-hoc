<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Sổ Lớp</title>
<style>
:root{
  --bg:#f3f5fb;--card:#fff;--ink:#14213d;--mut:#6b7590;--ln:#e4e8f1;
  --navy:#13306a;--navy2:#2453b8;--sky:#1e9be9;--or:#f7931e;
  --pri:#13306a;--pri2:#e9eefa;--on:#fff;
  --ok:#1f9d63;--ok2:#e3f6ec;--r:#d64545;--r2:#fdeaea;--y:#b7791f;--y2:#fff4dc;
  --sh:0 1px 2px rgba(20,33,61,.05),0 4px 14px rgba(20,33,61,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1322;--card:#171f36;--ink:#e7ecf7;--mut:#9aa6c2;--ln:#273150;
  --pri:#7aa2ff;--pri2:#1f2a4b;--on:#0d1322;
  --ok:#4cc38a;--ok2:#163627;--r:#f07878;--r2:#3a1d22;--y:#e8b65a;--y2:#3a2f16;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;margin:4px 0 4px;letter-spacing:-.3px}
h2{margin:2px 0;font-size:19px}h3{margin:0 0 10px;font-size:19px;padding-right:40px}
p{margin:6px 0}
.sub,small{color:var(--mut);font-size:14px}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px;font-size:17px;font-weight:700}
.lbl a,.lbl button{font-size:14px;font-weight:600;color:var(--pri);background:none;border:0;font-family:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

/* Đầu trang */
.top{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f2a63 0%,#2453b8 65%,#1e9be9 100%);color:#fff;
  margin:calc(-16px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 54px;border-radius:0 0 28px 28px}
.top::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
.top::before{content:"";position:absolute;right:60px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(247,147,30,.18)}
.toprow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.toprow .gr{flex:1}
.top h1{color:#fff;font-size:24px;margin:0}
.top .hi{font-size:16px;font-weight:600;margin-top:2px}
.top small{color:rgba(255,255,255,.8)}
.top h1{font-size:23px;line-height:1.25;margin:4px 0 0}
.center{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;font-weight:600;color:#ffd38a}.center svg.i{width:15px;height:15px}
.quote{position:relative;z-index:1;margin:10px 0 0;font-style:italic;font-size:14.5px;color:rgba(255,255,255,.92);max-width:520px}
.tstats{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tstats span,.tstats .schip{display:inline-flex;align-items:center;gap:6px;margin:0;border-radius:20px;padding:5px 11px;background:rgba(255,255,255,.14);font-size:13px;color:#fff}
.tstats svg.i{width:14px;height:14px}.tstats .hot{background:var(--or)}.tstats .schip span{background:none;padding:0}
.tstats .schip.warn{background:var(--or)}
.plane{display:none;position:absolute;z-index:0;pointer-events:none}
#lk .seg{justify-content:flex-start}#lk .btn.ln{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
.ava{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2px solid rgba(255,255,255,.7);flex:none;cursor:pointer;padding:0;overflow:hidden}
.ava img{width:34px;height:auto}
.sbox{position:relative;margin:-26px 4px 0;z-index:2}
.sbox input{padding:14px 14px 14px 44px;border-radius:16px;border:0;box-shadow:0 6px 20px rgba(19,48,106,.14);background:var(--card)}
.sbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut)}

/* Lưới truy cập nhanh */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--tc) 18%,transparent);border-radius:18px;padding:12px 10px 12px 12px;
  background:var(--card);background:color-mix(in srgb,var(--tc) 9%,var(--card));color:var(--ink);font-family:inherit;cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:2px}
.tile .tic{width:40px;height:40px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;margin-bottom:8px}
.tile b{font-size:14.5px;line-height:1.25}
.tile small{font-size:12px;line-height:1.3;padding-right:14px}
.tile .chev{position:absolute;right:8px;bottom:10px;color:var(--mut);width:14px;height:14px}
.badge{position:absolute;right:8px;top:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--or);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.badge.new{background:#7c5ce6}

/* Thẻ & danh sách */
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.ok{background:var(--ok2);color:var(--ok);border:0;box-shadow:none}
.list{background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.gr{flex:1;min-width:0}.gr b{display:block;overflow-wrap:anywhere}.gr small{display:block}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc,#2453b8) 13%,var(--card));color:var(--tc,#2453b8)}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.dbad{width:54px;flex:none;text-align:center;border-radius:14px;padding:6px 0;background:color-mix(in srgb,var(--or) 13%,var(--card));color:var(--or)}
.dbad small{display:block;font-size:11px;font-weight:700;color:inherit;letter-spacing:.5px}
.dbad b{display:block;font-size:22px;line-height:1.1;color:var(--ink)}
.dbad span{font-size:11px;color:var(--mut)}
.dbad.today{background:var(--or);color:#fff}.dbad.today b,.dbad.today span{color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mut);font-size:13px;margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:4px}.meta svg.i{width:14px;height:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.r{background:var(--r2);color:var(--r)}.chip.y{background:var(--y2);color:var(--y)}.chip.or{background:color-mix(in srgb,var(--or) 15%,var(--card));color:var(--or)}
.bar{height:8px;background:var(--ln);border-radius:9px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--sky))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{border-radius:16px;padding:12px;background:var(--card);border:1px solid var(--ln)}
.stat b{display:block;font-size:20px}.stat small{font-size:12px}

/* Nút */
.btn{display:block;border:0;border-radius:14px;padding:12px 16px;font-family:inherit;font-size:16px;font-weight:600;background:var(--pri);color:var(--on);width:100%;margin-top:12px;text-align:center;text-decoration:none;cursor:pointer}
.btn.sm{display:inline-block;width:auto;margin:0;padding:8px 12px;font-size:14px}
.btn.gh{background:var(--pri2);color:var(--pri)}.btn.rd{background:var(--r2);color:var(--r)}.btn.ln{background:transparent;color:var(--pri);border:1px solid var(--ln)}
.btn.or{background:var(--or);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.acts .btn{margin:0;flex:1}.acts .btn.sm{flex:none}
.mo{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}
.big{font-size:30px;font-weight:800;color:var(--pri)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:5px;vertical-align:middle;background:var(--r2);color:var(--r)}.tag.y{background:var(--y2);color:var(--y)}

/* Form */
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px}
textarea{min-height:130px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;margin:0;padding:8px 11px;border:1px solid var(--ln);border-radius:12px;color:var(--ink);font-size:15px;cursor:pointer}
.pill input{width:auto;margin:0;display:inline}
.pill.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.qr{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px;margin-top:12px}
.qr>svg{border-radius:8px;flex:none;width:130px;height:130px}
.btn svg.i{width:16px;height:16px;margin:-2px 4px 0 0}

/* Điểm danh */
.arow{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--ok2);color:var(--ok)}
.att-p .mark{background:var(--y2);color:var(--y)}.att-k .mark{background:var(--r2);color:var(--r)}
.att-p,.att-k{background:color-mix(in srgb,var(--r2) 40%,transparent)}
.note{flex-basis:100%;margin:0}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin:12px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--sky),var(--navy2));border-radius:5px 5px 0 0;min-height:2px}
.bars span{font-size:11px;color:var(--mut);margin-top:3px}

/* Thanh điều hướng dưới (điện thoại) */
#bot{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
#bot button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 7px;font-family:inherit;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#bot button.on{color:var(--pri);font-weight:700}
#bot button.on svg{stroke-width:2.4}
/* Menu bên trái (máy tính) */
#side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.brand img{width:44px}
.brand b{display:block;font-size:20px;color:var(--navy)}
.brand small{font-size:12px}
@media(prefers-color-scheme:dark){.brand b{color:#fff}}

/* Bảng trượt */
#sh{position:fixed;inset:0;z-index:10}
.bk{position:absolute;inset:0;background:rgba(8,15,35,.5)}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;overscroll-behavior:contain}
.x{position:absolute;right:14px;top:14px;border:0;background:var(--pri2);color:var(--pri);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#14213d;color:#fff;padding:10px 14px;border-radius:14px;z-index:30;font-size:14px;max-width:92%;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#ts button{border:0;background:none;color:#ffb35c;font-weight:700;font-family:inherit;font-size:14px;cursor:pointer}
#lk{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#0f2a63,#2453b8);color:#fff;display:grid;place-items:center;padding:24px}
#lk>div{width:100%;max-width:320px;text-align:center}
#lk input{text-align:center;font-size:24px;letter-spacing:8px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
#lk .btn{background:var(--or);color:#fff}
#lk .logo{background:#fff;border-radius:20px;padding:14px;width:84px;margin:0 auto 12px}
.about img.full{width:100%;max-width:360px;display:block;margin:6px auto 4px;background:#fff;border-radius:16px;padding:10px}
.schip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:0;border-radius:20px;padding:6px 12px;background:rgba(255,255,255,.16);color:#fff;font-family:inherit;font-size:13px;cursor:pointer}.schip svg.i{width:15px;height:15px}.schip.warn{background:var(--or)}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.ra{display:flex;gap:8px;flex:none}
@media(max-width:600px){
  .stats{grid-template-columns:1fr;gap:0;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
  .stat{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:0;border-bottom:1px solid var(--ln);padding:10px 14px}
  .stat:last-child{border-bottom:0}.stat b{font-size:17px}.stat small{font-size:14px}
  .fee .ra{flex-basis:100%;padding-left:48px}.fee .ra .btn{flex:1;padding:10px 12px}
}
[hidden]{display:none!important}

/* Máy tính / màn hình rộng */
@media(min-width:900px){
  body{display:grid;grid-template-columns:250px 1fr}
  #side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--card);border-right:1px solid var(--ln)}
  #side nav{display:flex;flex-direction:column;gap:4px}
  #side nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--mut);padding:11px 12px;border-radius:12px;font-family:inherit;font-size:15px;cursor:pointer;text-align:left}
  #side nav button:hover{background:var(--bg)}
  #side nav button.on{background:var(--pri2);color:var(--pri);font-weight:700}
  #side .foot{margin-top:auto;font-size:12px;color:var(--mut);padding:0 8px}
  #bot{display:none}
  main{max-width:1120px;width:100%;padding:28px 36px 48px}
  .top{margin:0;border-radius:24px;padding:26px 28px 60px}
  .top .ava{display:none}
  .plane{display:block;right:40px;bottom:26px;width:230px;opacity:.95}
  .quote{font-size:16px}
  .sbox{margin:-28px 28px 0;max-width:520px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .tile{min-height:126px;padding:16px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .wide .list,.wide{column-gap:22px}
  .pn{top:50%;bottom:auto;transform:translateY(-50%);border-radius:24px;max-height:86vh;width:600px;padding:24px}
  #ts{bottom:28px}
  .stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><img src="mark.png" alt=""><div><b>Sổ Lớp</b><small>by Đ-LAB</small></div></div>
  <nav id="sidenav"></nav>
  <div class="foot">Dữ liệu của bạn, do bạn giữ.<br>Đ-LAB · Nơi ý tưởng được tạo nên</div>
</aside>
<main id="app"></main>
<nav id="bot"></nav>
<div id="sh" hidden></div><div id="lk" hidden></div><div id="ts" hidden></div>
<input id="fileIn" type="file" accept=".json,application/json,text/plain" hidden>
<script src="qr.js"></script>
<script>
'use strict';
/* =========================================================
   SỔ LỚP · by Đ-LAB — quản lý lớp dạy thêm
   Chạy 100% trên máy, không gửi dữ liệu đi đâu.
   Dữ liệu lưu trong IndexedDB (kho của trình duyệt) + bản dự phòng localStorage.
   ========================================================= */
const VERSION='1.5.0';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('vi-VN')+'đ';
const fmtN=n=>Math.round(Number(n)||0).toLocaleString('vi-VN');
// Đọc số tiền: bỏ hết dấu chấm, phẩy, chữ — "800.000" → 800000 (tránh lỗi trình duyệt hiểu 800.000 là 800)
const parseMoney=v=>+(String(v||'').replace(/\D/g,''))||0;
const DN=['CN','T2','T3','T4','T5','T6','T7'], DNF=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>ymd(new Date());
const cm=()=>today().slice(0,7);
const shiftM=(m,k)=>{const[y,n]=m.split('-').map(Number),d=new Date(y,n-1+k,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const mLabel=m=>'tháng '+Number(m.slice(5))+'/'+m.slice(0,4);
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dLabel=s=>{const t=toDate(s);return DN[t.getDay()]+' '+t.getDate()+'/'+(t.getMonth()+1)};
const dLong=s=>{const t=toDate(s);return DNF[t.getDay()]+', ngày '+t.getDate()+'/'+(t.getMonth()+1)};
const nowHM=()=>{const t=new Date();return p2(t.getHours())+':'+p2(t.getMinutes())};
const digits=p=>String(p||'').replace(/\D/g,'');
const phoneLocal=p=>{let d=digits(p);if(d.startsWith('84')&&d.length>=11)d='0'+d.slice(2);return d};
// Chữ cái đầu của tên (bỏ qua số/điểm ở cuối tên, ví dụ "Nguyễn An 4.7" → "A")
const initial=n=>{const w=String(n).trim().split(/\s+/).filter(x=>/^\p{L}/u.test(x));return((w.pop()||'?').charAt(0)).toLocaleUpperCase('vi')};
const ascii=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

/* ---------- Biểu tượng (vẽ bằng SVG, dựa trên bộ Feather) ---------- */

const BANKS=[['970436','Vietcombank'],['970415','VietinBank'],['970418','BIDV'],['970405','Agribank'],['970407','Techcombank'],['970422','MB Bank'],['970416','ACB'],['970432','VPBank'],['970423','TPBank'],['970403','Sacombank'],['970441','VIB'],['970443','SHB'],['970437','HDBank'],['970448','OCB'],['970426','MSB'],['970440','SeABank'],['970449','LPBank'],['970431','Eximbank'],['970428','Nam A Bank'],['970409','Bac A Bank'],['970454','BVBank'],['970452','KienlongBank'],['970412','PVcomBank'],['970425','ABBANK']];
function tlv(id,v){return id+p2(v.length)+v}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function vietqr(bin,acc,amount,info){const mai=tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',acc))+tlv('02','QRIBFTTA');
  let s=tlv('00','01')+tlv('01',amount?'12':'11')+tlv('38',mai)+tlv('53','704')+(amount?tlv('54',String(Math.round(amount))):'')+tlv('58','VN')+(info?tlv('62',tlv('08',info)):'')+'6304';return s+crc16(s)}

function normalize(d){const b=BLANK();d=d||{};const n={...b,...d,set:{...b.set,...(d.set||{})},classes:d.classes||[],students:d.students||[],att:d.att||{},pays:d.pays||[],seen:d.seen||{}};
  if(n.set.title==='Lớp của thầy Định'){n.set.title='Sổ Lớp';if(!n.set.name)n.set.name='Định'}
  if(!n.set.bin&&n.set.bank){const f=BANKS.find(x=>x[1].toLowerCase()===n.set.bank.toLowerCase());if(f)n.set.bin=f[0]}
  return clean(n)}
// Làm sạch dữ liệu nạp vào (từ máy, file sao lưu, Drive): đúng kiểu, đúng định dạng.
// Chặn file sao lưu "chế" sẵn mã độc chèn vào giao diện. Dữ liệu hợp lệ giữ nguyên.
const reM=/^\d{4}-(0[1-9]|1[0-2])$/, reD=/^\d{4}-\d\d-\d\d$/, reT=/^([01]\d|2[0-3]):[0-5]\d$/, okId=x=>/^[\w-]{1,64}$/.test(x);
const str=v=>v==null?'':String(v), isObj=o=>o&&typeof o==='object';
function clean(n){const map={};
  // Mã bản ghi lạ → mã mới, tính cố định từ mã cũ (máy nào cũng ra cùng một mã, đồng bộ không bị nhân đôi)
  const hid=id=>{let h=2166136261;for(let i=0;i<id.length;i++)h=Math.imul(h^id.charCodeAt(i),16777619);return'x'+(h>>>0).toString(36)+id.length.toString(36)};
  const fix=id=>{id=str(id);if(okId(id))return id;if(!id)return'x'+uid();return map[id]||(map[id]=hid(id))};
  const ref=id=>{id=str(id);return okId(id)?id:(map[id]||'')};
  const fees=(a,nul)=>Array.isArray(a)?a.filter(e=>isObj(e)&&reM.test(e.from)).map(e=>({from:e.from,fee:nul&&e.fee==null?null:(+e.fee||0)})):[];
  for(const k of['title','xung','name','bank','bin','acc','holder'])n.set[k]=str(n.set[k]);
  n.classes=n.classes.filter(isObj).map(c=>({...c,id:fix(c.id),name:str(c.name),place:str(c.place),
    days:(Array.isArray(c.days)?c.days:[]).map(Number).filter(d=>Number.isInteger(d)&&d>=0&&d<=6),
    start:reT.test(c.start)?c.start:'17:30',end:reT.test(c.end)?c.end:'19:00',fees:fees(c.fees)}));
  n.students=n.students.filter(isObj).map(s=>{const o={...s,id:fix(s.id),name:str(s.name),pr:str(s.pr),pn:str(s.pn),pp:str(s.pp),note:str(s.note),fees:fees(s.fees,1)};
    if(!reM.test(o.from))delete o.from;if(o.left&&!reM.test(o.left))o.left='0000-00';return o});
  n.students.forEach(s=>{s.classId=ref(s.classId);if(Array.isArray(s.ch))s.ch=s.ch.filter(e=>isObj(e)&&(e.from==='0000-00'||reM.test(e.from))).map(e=>({from:e.from,cid:ref(e.cid)}));else delete s.ch});
  n.pays=n.pays.filter(isObj).map(p=>({...p,id:fix(p.id),sid:ref(p.sid),month:str(p.month),amount:+p.amount||0,date:reD.test(p.date)?p.date:'',how:str(p.how)}));
  const att={};for(const k in n.att){const r=n.att[k],[d,c]=k.split('|'),cid=ref(c);if(!reD.test(d)||!cid||!isObj(r)||!isObj(r.m))continue;
    const m={},nt={};for(const sid in r.m){const i=ref(sid);if(i&&['c','p','k'].includes(r.m[sid])){m[i]=r.m[sid];if(isObj(r.n)&&r.n[sid])nt[i]=str(r.n[sid])}}
    const o={...r,m,n:nt};delete o.t;delete o.cm;delete o.off;if(r.t)o.t=str(r.t);if(r.off)o.off=1;
    if(isObj(r.cm)){const cc={};for(const sid in r.cm){const i=ref(sid);if(i&&r.cm[sid])cc[i]=str(r.cm[sid])}if(Object.keys(cc).length)o.cm=cc}
    att[d+'|'+cid]=o}
  n.att=att;if(!isObj(n.del))delete n.del;return n}
let dbP=null;   // giữ một kết nối IndexedDB dùng chung, không mở mới mỗi lần lưu
function idb(){return dbP||(dbP=new Promise((ok,no)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>{r.result.onclose=r.result.onversionchange=()=>{try{r.result.close()}catch(e){}dbP=null};ok(r.result)};r.onerror=()=>{dbP=null;no(r.error)}}))}
async function kvGet(k){try{const d=await idb();return await new Promise((ok,no)=>{const q=d.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){return null}}
async function kvPut(k,v){try{const d=await idb();await new Promise((ok,no)=>{const t=d.transaction(ST,'readwrite');v===undefined?t.objectStore(ST).delete(k):t.objectStore(ST).put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}catch(e){}}

const cls=id=>S.classes.find(c=>c.id===id);
const stuById=id=>S.students.find(s=>s.id===id);
// Lịch sử học phí [{from:'YYYY-MM',fee}]: đổi học phí không làm sai các tháng cũ
function feeAt(list,m,strict){if(!list||!list.length)return null;const a=[...list].sort((x,y)=>x.from<y.from?-1:1);let f=strict?null:a[0].fee;for(const e of a)if(e.from<=m)f=e.fee;return f}
const classFee=(c,m)=>c?(feeAt(c.fees,m)||0):0;
// Lịch sử chuyển lớp ch:[{from:'YYYY-MM',cid}]: tháng cũ vẫn tính học phí theo lớp cũ
function clsAt(s,m){const h=s.ch;if(!h||!h.length)return s.classId;const a=[...h].sort((x,y)=>x.from<y.from?-1:1);let id=a[0].cid;for(const e of a)if(e.from<=m)id=e.cid;return id}
function stuFee(s,m){const own=feeAt(s.fees,m,true);return own!=null?own:classFee(cls(clsAt(s,m)),m)}
const enrolled=(s,m)=>(s.from||'0000-00')<=m&&(!s.left||m<=s.left);
const classStu=cid=>S.students.filter(s=>s.classId===cid&&!s.left).sort((a,b)=>a.name.localeCompare(b.name,'vi'));
const paidOf=(sid,m)=>S.pays.filter(p=>p.sid===sid&&p.month===m).reduce((a,p)=>a+(+p.amount||0),0);
function feeState(s,m){const due=enrolled(s,m)?stuFee(s,m):0,paid=paidOf(s.id,m);return{due,paid,rest:Math.max(0,due-paid),st:due<=0?(paid>0?'ok':'free'):paid>=due?'ok':paid>0?'part':'no'}}
const unpaid=m=>S.students.filter(s=>['no','part'].includes(feeState(s,m).st));
// Tiền thật đã thu (không tính khoản "miễn giảm" w:1) — dùng cho doanh thu
const isCash=p=>!p.w;
// Nợ dồn: các tháng từ lúc em vào học tới tháng `upto` còn thiếu tiền → {months:[{m,rest}], total}
function owe(s,upto){const c=cls(clsAt(s,upto)),f0=c&&c.fees.length?c.fees.reduce((a,e)=>e.from<a?e.from:a,'9999-99'):upto;
  let m=s.from||f0;const lim=shiftM(upto,-59);if(m<lim)m=lim;const months=[];let total=0;
  for(;m<=upto;m=shiftM(m,1)){const r=feeState(s,m).rest;if(r>0){months.push({m,rest:r});total+=r}}return{months,total}}
const debtors=upto=>S.students.map(s=>({s,o:owe(s,upto)})).filter(x=>x.o.total>0);
// "tháng 9, 10/2026" hoặc "tháng 12/2025, 1/2026"
const mList=ms=>{const y=ms[0].slice(0,4);return ms.every(m=>m.slice(0,4)===y)?'tháng '+ms.map(m=>Number(m.slice(5))).join(', ')+'/'+y:'tháng '+ms.map(m=>Number(m.slice(5))+'/'+m.slice(0,4)).join(', ')};
const dayTxt=c=>c.days.slice().sort((a,b)=>(a+6)%7-(b+6)%7).map(d=>DN[d]).join(', ');
const AK=(d,cid)=>d+'|'+cid;
function stuAtt(sid,pred){let c=0,p=0,k=0;for(const key in S.att){const v=S.att[key].m&&S.att[key].m[sid];if(!v)continue;if(pred&&!pred(key.slice(0,10)))continue;v==='c'?c++:v==='p'?p++:k++}return{c,p,k,t:c+p+k}}
function absentStreak(sid){const ds=[];for(const key in S.att){const v=S.att[key].m&&S.att[key].m[sid];if(v)ds.push([key.slice(0,10),v])}ds.sort((a,b)=>a[0]<b[0]?1:-1);let n=0;for(const[,v]of ds){if(v==='c')break;n++}return n}
function sessions(days){const t=new Date(),out=[];for(let i=0;i<days;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);S.classes.filter(c=>c.days.includes(d.getDay())).sort((a,b)=>a.start<b.start?-1:1).forEach(c=>{if(i>0||c.end>nowHM()||S.att[AK(ymd(d),c.id)])out.push({d,i,c})})}return out}

function quote(x){const t=new Date(),d=Math.floor((t-new Date(t.getFullYear(),0,0))/864e5);return QUOTES[d%QUOTES.length](x)}
const PLANE='<svg class="plane" viewBox="0 0 220 120" aria-hidden="true"><path d="M8 108 C 60 100, 110 80, 150 48" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><path d="M212 8 L120 44 L150 54 Z" fill="#ffb347"/><path d="M212 8 L150 54 L160 86 Z" fill="#f7931e"/><path d="M150 54 L160 86 L146 64 Z" fill="#d9700a"/></svg>';
function greet(){const h=new Date().getHours();return h<11?'Chào buổi sáng':h<13?'Chào buổi trưa':h<18?'Chào buổi chiều':'Chào buổi tối'}
function tile(o){return`<button class="tile" style="--tc:${o.c}" data-a="${o.a}" ${o.v?`data-v="${o.v}"`:''}><span class="tic">${ic(o.i)}</span><b>${o.t}</b><small class="sub">${o.s}</small>${ic('chev','chev')}${o.b?`<span class="badge ${o.bc||''}">${o.b}</span>`:''}</button>`}
function vHome(){const t=new Date(),m=cm(),td=today(),un=unpaid(m),allD=debtors(m),oldD=debtors(shiftM(m,-1)),todayC=S.classes.filter(c=>c.days.includes(t.getDay()));
  const x=S.set.xung||'bạn';
  let h=`<div class="top">${PLANE}<div class="toprow"><div class="gr"><small>${DNF[t.getDay()]}, ${t.getDate()}/${t.getMonth()+1}/${t.getFullYear()}</small><h1>${greet()}${S.set.name||S.set.xung?', '+esc(who()):''} 👋</h1>${S.set.title&&S.set.title!=='Sổ Lớp'?`<div class="center">${ic('home')}${esc(cap(S.set.title))}</div>`:''}</div><button class="ava" data-a="tab" data-v="more" aria-label="Cài đặt"><img src="mark.png" alt=""></button></div>
  <p class="quote">“${esc(quote(x))}”</p>
  <div class="tstats"><span>${ic('cal')}${todayC.length?todayC.length+' buổi hôm nay':'Hôm nay nghỉ dạy'}</span><span>${ic('users')}${S.students.filter(s=>!s.left).length} học sinh</span>${un.length?`<span class="hot">${ic('card')}${un.length} em chưa nộp</span>`:`<span>${ic('check')}Đã thu đủ</span>`}${syncChip()}</div></div>
  <div class="sbox">${ic('search')}<input id="hq" type="search" placeholder="Tìm học sinh, số điện thoại…" value="${esc(qHome)}" autocomplete="off"></div><div id="hres">${homeSearch()}</div>`;
  if(!S.classes.length)return h+`<div class="card" style="margin-top:18px"><h2>Chào ${esc(S.set.xung)}! Bắt đầu trong 3 bước</h2><p class="sub">1. Thêm lớp (tên, ngày học, giờ, học phí).<br>2. Thêm học sinh (dán cả danh sách cũng được).<br>3. Điểm danh, thu học phí, gửi báo cáo cho phụ huynh.</p><button class="btn" data-a="addcls">+ Thêm lớp đầu tiên</button><button class="btn ln" data-a="restore">Tôi có file sao lưu, khôi phục lại</button><button class="btn ln" data-a="guide">Xem hướng dẫn sử dụng</button></div>`;
  h+=`<div class="lbl">Truy cập nhanh</div><div class="grid">`+[
    {c:'#2453b8',i:'check',t:'Điểm danh',s:todayC.length?`Hôm nay ${todayC.length} lớp`:'Hôm nay không có lớp',a:'attpick'},
    {c:'#f08a24',i:'book',t:'Lớp học',s:`${S.classes.length} lớp`,a:'tab',v:'classes'},
    {c:'#22a565',i:'users',t:'Học sinh',s:`${S.students.filter(s=>!s.left).length} em đang học`,a:'tab',v:'students'},
    {c:'#7c5ce6',i:'card',t:'Học phí',s:`Tháng ${Number(m.slice(5))}`,a:'gofees',b:un.length||''},
    {c:'#e5527a',i:'bell',t:'Nhắc học phí',s:allD.length?`${allD.length} em còn nợ`:'Đã thu đủ',a:'remindall'},
    {c:'#1aa3b5',i:'msg',t:'Thông báo chung',s:'Nghỉ học, dạy bù…',a:'announce',b:S.seen.ann?'':'Mới',bc:'new'},
    {c:'#e0a800',i:'chart',t:'Báo cáo',s:'Tuần, tháng, năm',a:'tab',v:'more'},
    {c:'#4f5fd8',i:'file',t:'Xuất Excel',s:'Học phí, điểm danh',a:'export'},
    {c:'#5b6b86',i:'cloud',t:'Sao lưu',s:S.lastBackup?'Lần cuối '+new Date(S.lastBackup).toLocaleDateString('vi-VN'):'Chưa sao lưu',a:'backup',b:backupDue()?'!':''}
  ].map(tile).join('')+`</div>`;
  // Việc cần làm
  const todo=[];
  todayC.filter(c=>c.start<=nowHM()&&!S.att[AK(td,c.id)]).forEach(c=>todo.push(['#2453b8','check',`Chưa điểm danh lớp <b>${esc(c.name)}</b>`,`<button class="btn sm" data-a="att" data-id="${c.id}">Điểm danh</button>`]));
  const ms=missed();if(ms.length)todo.push(['#2453b8','check',`<b>${ms.length} buổi</b> chưa điểm danh trong 7 ngày qua`,`<button class="btn sm gh" data-a="missed">Xem</button>`]);
  if(un.length)todo.push(['#7c5ce6','card',`<b>${un.length} học sinh</b> chưa nộp đủ học phí ${mLabel(m)}`,`<button class="btn sm gh" data-a="remindall">Nhắc</button>`]);
  if(oldD.length)todo.push(['#d64545','card',`<b>${oldD.length} học sinh</b> còn nợ học phí các tháng trước (${money(oldD.reduce((a,x)=>a+x.o.total,0))})`,`<button class="btn sm gh" data-a="remindall">Nhắc</button>`]);
  S.students.filter(s=>!s.left).forEach(s=>{const k=absentStreak(s.id);if(k>=2)todo.push(['#d64545','alert',`<b>${esc(s.name)}</b> vắng ${k} buổi liên tiếp`,`<button class="btn sm gh" data-a="contact" data-id="${s.id}">Hỏi thăm</button>`])});
  if(backupDue())todo.push(['#5b6b86','cloud',S.lastBackup?'Đã hơn 2 tuần chưa sao lưu':'Chưa sao lưu dữ liệu lần nào',`<button class="btn sm gh" data-a="backup">Sao lưu</button>`]);
  const todoH=`<div class="lbl">Việc cần làm</div>`+(todo.length?`<div class="list">${todo.map(x=>`<div class="row"><span class="ic" style="--tc:${x[0]}">${ic(x[1])}</span><div class="gr">${x[2]}</div>${x[3]}</div>`).join('')}</div>`:`<div class="card ok">✓ Không còn việc tồn đọng. Chúc ${esc(S.set.xung)} dạy vui!</div>`);
  const ss=sessions(7).slice(0,6);
  const upH=`<div class="lbl">Lịch dạy sắp tới<button data-a="tab" data-v="classes">Xem tất cả</button></div>`+(ss.length?`<div class="list">${ss.map(x=>{const ds=ymd(x.d),done=S.att[AK(ds,x.c.id)];
    return`<div class="row"><div class="dbad ${x.i?'':'today'}"><small>TH${x.d.getMonth()+1}</small><b>${x.d.getDate()}</b><span>${DN[x.d.getDay()]}</span></div><div class="gr"><b>${esc(x.c.name)}</b><div class="meta"><span>${ic('clock')}${x.c.start} – ${x.c.end}</span>${x.c.place?`<span>${ic('pin')}${esc(x.c.place)}</span>`:''}<span>${ic('users')}${classStu(x.c.id).length}</span></div></div>${x.i?`<span class="chip">${x.i===1?'Ngày mai':'Sắp tới'}</span>`:done?`<button class="btn sm gh" data-a="att" data-id="${x.c.id}">${done.off?'Nghỉ':'✓ Đã điểm danh'}</button>`:`<button class="btn sm" data-a="att" data-id="${x.c.id}">Điểm danh</button>`}</div>`}).join('')}</div>`:'<div class="card">Không có buổi dạy nào trong 7 ngày tới.</div>');
  return h+`<div class="cols"><div>${todoH}</div><div>${upH}</div></div>`}
function homeSearch(){const q=qHome.trim().toLowerCase();if(!q)return'';const d=digits(q);
  const r=S.students.filter(s=>s.name.toLowerCase().includes(q)||(d&&digits(s.pp).includes(d))).slice(0,8);
  return`<div class="list" style="margin-top:12px">${r.map(s=>`<div class="row"><i class="av">${esc(initial(s.name))}</i><div class="gr"><b>${esc(s.name)}</b><small>${esc((cls(s.classId)||{}).name||'')}${s.pp?' · '+esc(s.pp):''}</small></div>${s.pp?`<a class="btn sm gh" href="tel:${phoneLocal(s.pp)}">Gọi</a>`:''}<button class="btn sm gh" data-a="edstu" data-id="${s.id}">Mở</button></div>`).join('')||'<div class="row"><small>Không tìm thấy học sinh nào.</small></div>'}</div>`}

/* ---------- Lớp ---------- */
function vClasses(){const m=cm();let h=`<h1>Lớp học</h1><p class="sub">${S.classes.length} lớp · ${S.students.filter(s=>!s.left).length} học sinh</p><div class="cols" style="margin-top:14px">`;
  if(!S.classes.length)h+='<div class="card">Chưa có lớp nào.</div>';
  S.classes.forEach(c=>{const st=classStu(c.id),fs=st.map(s=>feeState(s,m)).filter(f=>f.st!=='free'),pd=fs.filter(f=>f.st==='ok').length;
    h+=`<div class="card"><div style="display:flex;gap:12px;align-items:flex-start"><span class="ic" style="--tc:#f08a24">${ic('book')}</span><div class="gr"><h2>${esc(c.name)}</h2><div class="meta"><span>${ic('cal')}${dayTxt(c)}</span><span>${ic('clock')}${c.start} – ${c.end}</span>${c.place?`<span>${ic('pin')}${esc(c.place)}</span>`:''}</div></div></div><div class="sub" style="margin-top:8px">Học phí ${money(classFee(c,m))}/tháng · ${st.length} học sinh</div><div class="bar"><i style="width:${fs.length?pd/fs.length*100:0}%"></i></div><small>Đã thu đủ ${pd}/${fs.length} em ${mLabel(m)}</small><div class="acts"><button class="btn sm" data-a="att" data-id="${c.id}">Điểm danh</button><button class="btn sm gh" data-a="announce" data-id="${c.id}">Thông báo</button><button class="btn sm gh" data-a="addstu" data-id="${c.id}">+ Học sinh</button><button class="btn sm gh" data-a="edcls" data-id="${c.id}">Sửa</button></div></div>`});
  return h+`</div><button class="btn gh" data-a="addcls">+ Thêm lớp mới</button>`}
function clsForm(c){const days=c?c.days:[],m=cm();
  sheet(`<h3>${c?'Sửa lớp':'Thêm lớp mới'}</h3><label>Tên lớp<input id="f1" value="${esc(c?c.name:'')}" placeholder="Tin học · Lớp 4"></label><label>Ngày học trong tuần</label><div class="days">${[1,2,3,4,5,6,0].map(d=>`<label class="pill ${days.includes(d)?'on':''}"><input type="checkbox" value="${d}" ${days.includes(d)?'checked':''}>${DN[d]}</label>`).join('')}</div><div class="two"><label>Bắt đầu<input id="f2" type="time" value="${c?c.start:'17:30'}"></label><label>Kết thúc<input id="f3" type="time" value="${c?c.end:'19:00'}"></label></div><label>Địa điểm<input id="f4" value="${esc(c?c.place:'')}" placeholder="Tại nhà"></label><label>Học phí mỗi tháng (đồng)<input id="f5" class="money" type="text" inputmode="numeric" autocomplete="off" value="${c?fmtN(classFee(c,m)):''}" placeholder="800000"></label>${c?`<label>Học phí mới áp dụng từ tháng<input id="f6" type="month" value="${m}"></label><p class="hint">Các tháng trước đó vẫn giữ học phí cũ.</p>`:''}<button class="btn" data-a="savecls" data-id="${c?c.id:''}">Lưu lớp</button>${c?`<button class="btn rd" data-a="delcls" data-id="${c.id}">Xóa lớp</button>`:''}`)}
function saveCls(id){const n=$('#f1').value.trim(),d=$$('.days input:checked').map(x=>+x.value),fee=parseMoney($('#f5').value),st=$('#f2').value||'17:30',en=$('#f3').value||'19:00';
  if(!n||!d.length)return toast('Nhập tên lớp và chọn ít nhất một ngày học');
  if(en<=st)return toast('Giờ kết thúc phải sau giờ bắt đầu');
  const base={name:n,days:d,start:st,end:en,place:$('#f4').value.trim()};
  if(id){const c=cls(id);Object.assign(c,base);const from=$('#f6').value||cm();if(classFee(c,from)!==fee){c.fees=c.fees.filter(e=>e.from!==from);c.fees.push({from,fee})}toast('Đã lưu lớp')}
  else{S.classes.push({id:uid(),...base,fees:[{from:cm(),fee}]});toast('Đã thêm lớp '+n)}
  closeSh();keep()}

/* ---------- Học sinh ---------- */
function stuRow(s){const m=cm(),a=stuAtt(s.id,d=>d.slice(0,7)===m),k=absentStreak(s.id);
  return`<div class="row"><i class="av">${esc(initial(s.name))}</i><div class="gr"><b>${esc(s.name)}${k>=2?`<span class="tag">vắng ${k} buổi liền</span>`:''}${feeAt(s.fees,m,true)!=null?'<span class="tag y">HP riêng</span>':''}</b><small>${a.t?`Tháng này: có mặt ${a.c}/${a.t} buổi`:'Tháng này chưa có điểm danh'}</small>${s.pp?`<small>${esc(s.pr||'Phụ huynh')}${s.pn?' '+esc(s.pn):''} · ${esc(s.pp)}</small>`:''}${s.note?`<small>📌 ${esc(s.note)}</small>`:''}</div>${s.pp?`<a class="btn sm gh" href="tel:${phoneLocal(s.pp)}" aria-label="Gọi">${ic('phone')}</a>`:''}<button class="btn sm gh" data-a="edstu" data-id="${s.id}">Sửa</button></div>`}
function stuList(){const q=qStu.trim().toLowerCase(),d=digits(q),f=s=>!q||s.name.toLowerCase().includes(q)||(d&&digits(s.pp).includes(d));let h='';
  S.classes.forEach(c=>{const st=classStu(c.id).filter(f);if(q&&!st.length)return;h+=`<div><div class="lbl">${esc(c.name)} <small>${st.length} học sinh</small></div><div class="list">${st.map(stuRow).join('')||'<div class="row"><small>Lớp chưa có học sinh</small></div>'}</div></div>`});
  const orphan=S.students.filter(s=>!s.left&&!cls(s.classId)).filter(f);if(orphan.length)h+=`<div><div class="lbl">Chưa xếp lớp <small>${orphan.length}</small></div><div class="list">${orphan.map(stuRow).join('')}</div></div>`;
  const gone=S.students.filter(s=>s.left).filter(f);if(gone.length)h+=`<div><div class="lbl">Đã nghỉ học <small>${gone.length}</small></div><div class="list">${gone.map(stuRow).join('')}</div></div>`;
  return h?`<div class="cols">${h}</div>`:'<div class="card">Không tìm thấy học sinh nào.</div>'}
function vStudents(){return`<h1>Học sinh</h1><p class="sub">${S.students.filter(s=>!s.left).length} em đang học · ${S.classes.length} lớp</p>${S.students.length>5?`<div class="sbox" style="margin:12px 0 0">${ic('search')}<input id="q" type="search" placeholder="Tìm theo tên hoặc số điện thoại" value="${esc(qStu)}"></div>`:''}<div id="stul">${stuList()}</div><button class="btn gh" data-a="addstu">+ Thêm học sinh</button>`}
function addStuForm(cid){if(!S.classes.length)return toast('Hãy thêm lớp trước');
  sheet(`<h3>Thêm học sinh</h3><label>Lớp<select id="g1">${S.classes.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Danh sách học sinh, mỗi dòng một em<textarea id="g2" placeholder="Nguyễn Văn An - 0912345678&#10;Trần Thị Bình"></textarea></label><p class="hint">Có thể ghi kèm số điện thoại phụ huynh sau dấu gạch ngang. Dán thẳng danh sách từ Excel hoặc Zalo cũng được.</p><button class="btn" data-a="savestu">Lưu</button>`)}
function saveStu(){const cid=$('#g1').value,lines=$('#g2').value.split(/\r?\n/).map(x=>x.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);
  if(!lines.length)return toast('Nhập ít nhất một tên');
  lines.forEach(l=>{let name=l,pp='';const mm=l.match(/^(.*?)[\s,;:\t\-–]+(\+?\d[\d .]{7,}\d)$/);if(mm){name=mm[1].trim();pp=mm[2].replace(/\s|\./g,'')}if(name)S.students.push({id:uid(),name,classId:cid,pp,pr:'',pn:'',note:'',fees:[],from:cm()})});
  closeSh();keep();toast('Đã thêm '+lines.length+' học sinh')}
function edStuForm(s){const m=cm(),own=feeAt(s.fees,m,true),c=cls(s.classId);
  sheet(`<h3>Sửa học sinh</h3><label>Họ tên<input id="e1" value="${esc(s.name)}"></label><label>Lớp<select id="e2">${S.classes.map(c=>`<option value="${c.id}" ${c.id===s.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><div class="two"><label>Phụ huynh là<input id="e3" value="${esc(s.pr)}" placeholder="Mẹ, Ba, Bà…"></label><label>Tên phụ huynh<input id="e4" value="${esc(s.pn)}"></label></div><label>Số điện thoại (Zalo)<input id="e5" type="tel" inputmode="tel" value="${esc(s.pp)}"></label><label>Ghi chú<input id="e6" value="${esc(s.note)}" placeholder="Đón con lúc 19:00, dị ứng…"></label><label>Học phí riêng / tháng (để trống = theo lớp${c?': '+money(classFee(c,m)):''})<input id="e7" class="money" type="text" inputmode="numeric" autocomplete="off" value="${own!=null?fmtN(own):''}" placeholder="Ví dụ giảm cho anh chị em"></label><div class="two"><label>Áp dụng từ tháng<input id="e8" type="month" value="${m}"></label><label>Bắt đầu học từ<input id="e9" type="month" value="${s.from||m}"></label></div><button class="btn" data-a="saveed" data-id="${s.id}">Lưu</button><div class="acts">${s.left?`<button class="btn gh" data-a="back" data-id="${s.id}">Học trở lại</button>`:`<button class="btn ln" data-a="leave" data-id="${s.id}">Cho nghỉ học</button>`}<button class="btn rd" data-a="delstu" data-id="${s.id}">Xóa hẳn</button></div><p class="hint">"Cho nghỉ học" giữ lại lịch sử học phí và điểm danh. "Xóa hẳn" xóa mọi dữ liệu của em này. Chuyển lớp: từ tháng này tính học phí theo lớp mới, các tháng trước vẫn theo lớp cũ.</p>`)}
function saveEd(id){const s=stuById(id),n=$('#e1').value.trim(),oldC=s.classId;if(!n)return toast('Tên không được để trống');
  Object.assign(s,{name:n,classId:$('#e2').value,pr:$('#e3').value.trim(),pn:$('#e4').value.trim(),pp:$('#e5').value.trim(),note:$('#e6').value.trim(),from:$('#e9').value||s.from||cm()});
  const v=$('#e7').value.trim(),from=$('#e8').value||cm(),cur0=feeAt(s.fees,from,true),nv=v===''?null:parseMoney(v);
  if(cur0!==nv){s.fees=(s.fees||[]).filter(e=>e.from!==from);s.fees.push({from,fee:nv})}
  // Chuyển lớp: ghi lại lịch sử để các tháng trước vẫn tính theo lớp cũ (em mới vào học tháng này thì chỉ cần đổi lớp)
  if(s.classId!==oldC){const m0=cm(),h=s.ch&&s.ch.length?s.ch:null;if(h||(s.from||'0000-00')<m0)s.ch=(h||[{from:'0000-00',cid:oldC}]).filter(e=>e.from!==m0).concat({from:m0,cid:s.classId})}
  closeSh();keep();toast('Đã lưu')}

/* ---------- Điểm danh: 'c' có mặt, 'p' vắng có phép, 'k' vắng không phép ---------- */
let cur=null;
function attPick(){const t=new Date(),td=S.classes.filter(c=>c.days.includes(t.getDay()));if(!S.classes.length)return toast('Hãy thêm lớp trước');if(td.length===1)return openAtt(td[0].id,today());
  const list=[...td,...S.classes.filter(c=>!td.includes(c))];
  sheet(`<h3>Điểm danh lớp nào?</h3><div class="list">${list.map(c=>`<div class="row"><span class="ic" style="--tc:${td.includes(c)?'#f7931e':'#2453b8'}">${ic('book')}</span><div class="gr"><b>${esc(c.name)}</b><small>${td.includes(c)?'Hôm nay · ':''}${dayTxt(c)} · ${c.start} – ${c.end}</small></div><button class="btn sm ${td.includes(c)?'':'gh'}" data-a="att" data-id="${c.id}">Chọn</button></div>`).join('')}</div>`)}
function openAtt(cid,date){const c=cls(cid);if(!c)return;const r=S.att[AK(date,cid)];
  const ids=new Set(classStu(cid).filter(s=>enrolled(s,date.slice(0,7))||!s.from).map(s=>s.id));if(r&&r.m)Object.keys(r.m).forEach(id=>{if(stuById(id))ids.add(id)});
  // t: nội dung buổi học (sổ đầu bài), c: nhận xét từng em, sc: em đang mở ô nhận xét; off: buổi nghỉ không dạy
  cur={cid,date,exist:!!r,off:!!(r&&r.off),ids:[...ids].sort((a,b)=>stuById(a).name.localeCompare(stuById(b).name,'vi')),m:{},n:{},c:{},sc:{},t:(r&&r.t)||''};
  cur.ids.forEach(id=>{cur.m[id]=(r&&r.m[id])||'c';cur.n[id]=(r&&r.n&&r.n[id])||'';cur.c[id]=(r&&r.cm&&r.cm[id])||''});
  sheet(`<h3>Điểm danh · ${esc(c.name)}</h3><label>Ngày<input id="ad" type="date" value="${date}" max="${today()}"></label>${cur.off?'<p class="sub">Buổi này đã đánh dấu <b>nghỉ (không dạy)</b>. Lưu điểm danh để thay.</p>':cur.exist?'<p class="sub">Ngày này đã điểm danh, đang sửa lại.</p>':''}<label>Nội dung buổi học (không bắt buộc)<input id="at" value="${esc(cur.t)}" placeholder="Ví dụ: Gõ 10 ngón, bài 3" autocomplete="off"></label><p class="hint">Cả lớp mặc định <b>có mặt</b>. Chạm vào bạn vắng: 1 lần = <b>vắng có phép (P)</b>, 2 lần = <b>vắng không phép (K)</b>, 3 lần = có mặt lại. Bấm ${ic('msg')} để ghi nhận xét riêng cho em, nhận xét sẽ có trong báo cáo tháng.</p><div class="list" style="margin-top:10px">${cur.ids.map(attRow).join('')||'<div class="row"><small>Lớp chưa có học sinh.</small></div>'}</div><div class="sub" id="asum">${attSum()}</div><button class="btn" data-a="saveatt">Lưu điểm danh</button>${cur.exist?`<button class="btn rd" data-a="delatt">${cur.off?'Bỏ đánh dấu nghỉ':'Xóa buổi điểm danh này'}</button>`:`<button class="btn ln" data-a="attoff" data-id="${cid}" data-v="${date}">Buổi này nghỉ, không dạy</button>`}`)}
function attRow(id){const s=stuById(id),v=cur.m[id],L={c:['✓','Có mặt'],p:['P','Vắng có phép'],k:['K','Vắng không phép']}[v];
  return`<div class="row att-${v}" id="ar-${id}"><button class="arow" data-a="tog" data-id="${id}"><span class="mark">${L[0]}</span><span class="gr"><b>${esc(s.name)}</b><small>${L[1]}${cur.c[id]?' · có nhận xét':''}</small></span></button><button class="btn sm gh" data-a="cmt" data-id="${id}" aria-label="Nhận xét">${ic('msg')}</button>${v!=='c'?`<input class="note" data-note="${id}" placeholder="Lý do (không bắt buộc)" value="${esc(cur.n[id])}">`:''}${cur.sc[id]||cur.c[id]?`<input class="note" data-cmt="${id}" placeholder="Nhận xét cho em (gửi kèm báo cáo tháng)" value="${esc(cur.c[id])}">`:''}</div>`}
// Buổi bị bỏ sót: 7 ngày qua, đúng lịch lớp, chưa điểm danh và chưa đánh dấu nghỉ.
// Chỉ tính từ sau buổi điểm danh đầu tiên của lớp (lớp mới tạo chưa bị nhắc oan).
function missed(){const first={},out=[],t=new Date();for(const k in S.att){const[d,c]=k.split('|');if(!first[c]||d<first[c])first[c]=d}
  for(let i=1;i<=7;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i),ds=ymd(d);S.classes.forEach(c=>{if(c.days.includes(d.getDay())&&first[c.id]&&ds>first[c.id]&&!S.att[AK(ds,c.id)])out.push({ds,c})})}return out}
function missSheet(){const ms=missed();if(!ms.length)return closeSh();
  sheet(`<h3>Buổi chưa điểm danh</h3><p class="sub">${ms.length} buổi trong 7 ngày qua. Điểm danh bổ sung, hoặc bấm "Nghỉ" nếu hôm đó không dạy.</p><div class="list">${ms.map(({ds,c})=>{const d=toDate(ds);return`<div class="row"><div class="dbad"><small>TH${d.getMonth()+1}</small><b>${d.getDate()}</b><span>${DN[d.getDay()]}</span></div><div class="gr"><b>${esc(c.name)}</b><small>${c.start} – ${c.end}</small></div><button class="btn sm gh" data-a="attoff" data-id="${c.id}" data-v="${ds}" data-list="1">Nghỉ</button><button class="btn sm" data-a="attd" data-id="${c.id}" data-v="${ds}">Điểm danh</button></div>`}).join('')}</div>`)}
function attSum(){const v=Object.values(cur.m);return`Có mặt ${v.filter(x=>x==='c').length} · Có phép ${v.filter(x=>x==='p').length} · Không phép ${v.filter(x=>x==='k').length}`}

  <label>${{nghi:'Lý do (không bắt buộc)',bu:'Ghi chú thêm (không bắt buộc)',doi:'Lịch mới (ví dụ: Thứ 3 và Thứ 6)',nhac:'Nội dung cần nhắc'}[ann.k]}<input id="n4" placeholder="${{nghi:'Thầy đi tập huấn',bu:'Các em mang theo vở bài tập',doi:'Thứ 3, Thứ 6',nhac:'Các em ôn bài chuẩn bị kiểm tra'}[ann.k]}"></label>
  <label>Tin nhắn<textarea id="nm"></textarea></label><button class="btn" data-a="cpnm">Sao chép để dán vào nhóm Zalo</button>`);

/* ---------- Học phí ---------- */
function vFees(){const list=S.students.filter(s=>enrolled(s,fm)||paidOf(s.id,fm)>0).map(s=>({s,f:feeState(s,fm),old:owe(s,shiftM(fm,-1))}));
  const exp=list.reduce((a,x)=>a+x.f.due,0),rest=list.reduce((a,x)=>a+x.f.rest,0),got=S.pays.filter(p=>p.month===fm&&isCash(p)).reduce((a,p)=>a+(+p.amount||0),0),nNo=list.filter(x=>['no','part'].includes(x.f.st)).length;
  const oldD=debtors(shiftM(fm,-1)),oldT=oldD.reduce((a,x)=>a+x.o.total,0);
  let h=`<h1>Học phí</h1><div class="mo"><button class="btn sm gh" data-a="mo" data-v="-1" aria-label="Tháng trước">‹</button><b>${mLabel(fm).replace(/^t/,'T')}</b><button class="btn sm gh" data-a="mo" data-v="1" aria-label="Tháng sau">›</button></div><div class="card"><small>Đã thu</small><div class="big">${money(got)}</div><div class="bar"><i style="width:${exp?Math.min(100,(exp-rest)/exp*100):0}%"></i></div><div class="stats"><div class="stat"><small>Dự kiến</small><b>${money(exp)}</b></div><div class="stat"><small>Còn phải thu</small><b style="color:var(--r)">${money(rest)}</b></div><div class="stat"><small>Chưa nộp đủ</small><b>${nNo} em</b></div></div>${oldT?`<p class="hint" style="color:var(--r)">Ngoài ra còn nợ các tháng trước: <b>${money(oldT)}</b> (${oldD.length} em)</p>`:''}${nNo||oldT?'<button class="btn or" data-a="remindall">Nhắc tất cả phụ huynh còn nợ</button>':''}</div>`;
  const grp=(t,st,chip)=>{const a=list.filter(x=>x.f.st===st);return a.length?`<div><div class="lbl">${t} <span class="chip ${chip}">${a.length}</span></div><div class="list">${a.map(feeRow).join('')}</div></div>`:''};
  if(!list.length)return h+'<div class="card">Tháng này chưa có học sinh nào.</div>';
  return h+`<div class="cols">`+grp('Chưa nộp','no','r')+grp('Nộp thiếu','part','y')+grp('Đã nộp đủ','ok','ok')+grp('Không tính phí','free','')+`</div>`}
function feeRow({s,f,old}){const c=cls(s.classId),n=old.months.length;
  return`<div class="row fee"><button class="arow" data-a="paydt" data-id="${s.id}"><i class="av">${esc(initial(s.name))}</i><span class="gr"><b>${esc(s.name)}${n?`<span class="tag">nợ ${n} tháng trước</span>`:''}</b><small>${esc(c?c.name:'')} · ${money(f.due)}${f.st==='part'?` · đã nộp ${money(f.paid)}, còn ${money(f.rest)}`:''}</small></span></button>${f.st==='no'||f.st==='part'?`<div class="ra"><button class="btn sm gh" data-a="nhac" data-id="${s.id}">Nhắc</button><button class="btn sm" data-a="payfull" data-id="${s.id}">Thu ${f.st==='part'?'nốt':'đủ'}</button></div>`:f.st==='ok'?`<div class="ra">${n?`<button class="btn sm gh" data-a="nhac" data-id="${s.id}">Nhắc nợ cũ</button>`:''}<button class="btn sm gh" data-a="paydt" data-id="${s.id}">✓ Đã thu</button></div>`:''}</div>`}
function payDetail(s){const f=feeState(s,fm),ps=S.pays.filter(p=>p.sid===s.id&&p.month===fm),old=owe(s,shiftM(fm,-1));
  sheet(`<h3>${esc(s.name)} · ${mLabel(fm)}</h3><p class="sub">Phải nộp ${money(f.due)} · Đã nộp ${money(f.paid)} · Còn ${money(f.rest)}</p>${old.total?`<div class="card" style="background:var(--r2);border:0;box-shadow:none"><b style="color:var(--r)">Còn nợ các tháng trước: ${money(old.total)}</b><div class="acts">${old.months.map(o=>`<button class="btn sm gh" data-a="paym" data-id="${s.id}" data-v="${o.m}">T${Number(o.m.slice(5))}/${o.m.slice(0,4)}: ${money(o.rest)}</button>`).join('')}</div><p class="hint">Bấm vào từng tháng để thu hoặc miễn tiền tháng đó.</p></div>`:''}${ps.length?`<div class="list">${ps.map(p=>`<div class="row"><div class="gr"><b>${money(p.amount)}${p.w?'<span class="tag y">Miễn giảm</span>':''}</b><small>Ngày ${p.date.split('-').reverse().join('/')}${p.how&&!p.w?' · '+esc(p.how):''}</small></div>${p.w?'':`<button class="btn sm gh" data-a="rcpt" data-id="${p.id}">Phiếu thu</button>`}<button class="btn sm rd" data-a="delpay" data-id="${p.id}">Xóa</button></div>`).join('')}</div>`:''}<label>Số tiền thu<input id="pa" class="money" type="text" inputmode="numeric" autocomplete="off" value="${f.rest?fmtN(f.rest):''}"></label><div class="two"><label>Ngày thu<input id="pd" type="date" value="${today()}"></label><label>Hình thức<select id="ph"><option>Tiền mặt</option><option>Chuyển khoản</option></select></label></div><button class="btn" data-a="savepay" data-id="${s.id}">Lưu khoản thu</button>${f.rest||old.total?`<button class="btn gh" data-a="nhac" data-id="${s.id}">Soạn tin nhắc học phí</button>`:''}${f.rest?`<button class="btn ln" data-a="waive" data-id="${s.id}">Miễn ${money(f.rest)} còn lại của ${mLabel(fm)}</button><p class="hint">Miễn giảm: tháng này coi như đã đủ, nhưng không tính vào doanh thu.</p>`:''}`)}
function addPay(sid,amount,date,how){const p={id:uid(),sid,month:fm,amount,date,how};S.pays.push(p);keep();return p}
const TPL=[['Nhẹ nhàng',(s,x)=>`Dạ ${x.xung} chào phụ huynh em ${s.name} ạ. ${x.xung} xin gửi thông tin học phí ${x.thang} lớp ${x.lop}: ${x.tien}. Phụ huynh tiện lúc nào gửi giúp ${x.xung} nhé. Cảm ơn phụ huynh nhiều ạ!`],
  ['Bình thường',(s,x)=>`Kính chào phụ huynh em ${s.name}. ${x.xung} xin nhắc học phí ${x.thang} lớp ${x.lop} của em${x.part?' còn thiếu':''}: ${x.tien}. Phụ huynh vui lòng hoàn tất trong tuần này giúp ${x.xung}. Cảm ơn phụ huynh ạ.`],
  ['Trực tiếp',(s,x)=>`Kính gửi phụ huynh em ${s.name}. Học phí ${x.thang} lớp ${x.lop} của em hiện chưa hoàn tất (còn ${x.tien}). Mong phụ huynh thanh toán trước ngày ${x.han}. Nếu đã chuyển khoản, phụ huynh nhắn giúp ${x.xung} để kiểm tra ạ. Cảm ơn phụ huynh.`]];
// Số tiền cần nhắc: mọi tháng còn nợ tính đến tháng đang xem (fm)
function dueInfo(s){const o=owe(s,fm);if(o.total)return o;const f=feeState(s,fm);return{months:[{m:fm,rest:f.due}],total:f.due}}
// Nội dung chuyển khoản (không dấu, tối đa 25 ký tự): giữ đủ phần "HP T9 T10"; tên dài thì bỏ bớt họ, đệm ở đầu
const payInfo=(s,ms)=>{const n=ms.map(m=>Number(m.slice(5))),suf='HP '+(n.length>3?'T'+n[0]+'-T'+n[n.length-1]:n.map(x=>'T'+x).join(' ')),max=24-suf.length;
  let w=ascii(s.name).split(' ');const lt=w.filter(x=>/[A-Za-z]/.test(x));if(lt.length)w=lt;   // bỏ "4 7" (lớp ở trường)
  while(w.length>1&&w.join(' ').length>max)w.shift();return(w.join(' ').slice(0,Math.max(0,max))+' '+suf).trim().slice(0,25)};
function remindText(s,i){const o=dueInfo(s),ms=o.months.map(e=>e.m),c=cls(s.classId),d=new Date(Date.now()+3*864e5),st=S.set;
  const x={xung:st.xung||'Thầy',thang:mList(ms),lop:c?c.name:'',tien:money(o.total),part:ms.length===1&&feeState(s,ms[0]).st==='part',han:d.getDate()+'/'+(d.getMonth()+1)};
  let t=TPL[i][1](s,x);if(ms.length>1)t+=`\n(Chi tiết: ${o.months.map(e=>'T'+Number(e.m.slice(5))+': '+money(e.rest)).join(', ')})`;
  if(st.acc){const bn=(BANKS.find(b=>b[0]===st.bin)||[])[1]||st.bank;t+=`\n\nChuyển khoản: ${bn?bn+' · ':''}STK ${st.acc}${st.holder?' · '+st.holder:''}\nNội dung: ${payInfo(s,ms)}`}return t}
function qrBlock(s){const st=S.set,o=dueInfo(s),info=payInfo(s,o.months.map(e=>e.m));if(!st.acc||!st.bin)return`<p class="hint">💡 Vào <b>Báo cáo → Thông tin & tài khoản</b>, chọn ngân hàng và nhập số tài khoản để app tạo <b>mã QR chuyển khoản</b> cho phụ huynh quét.</p>`;
  try{const code=vietqr(st.bin,st.acc,o.total,info);return`<div class="qr">${QR.svg(code,130)}<div><b>Mã QR chuyển khoản</b><p class="sub">${money(o.total)} · ${esc(info)}</p><button class="btn sm or" data-a="qrimg" data-id="${s.id}">${ic('dl')} Lưu ảnh mã QR</button></div></div><p class="hint">Gửi ảnh mã QR qua Zalo, phụ huynh quét bằng app ngân hàng là điền sẵn số tiền và nội dung. <b>Lần đầu hãy tự quét thử</b> để kiểm tra.</p>`}catch(e){return''}}
function remind(s,i=0){msgSheet('Nhắc học phí · '+esc(s.name),s,remindText(s,i),`<div class="seg">${TPL.map((t,k)=>`<button class="btn sm ${k===i?'':'gh'}" data-a="tpl" data-id="${s.id}" data-v="${k}">${t[0]}</button>`).join('')}</div>`,qrBlock(s))}
function remindAll(){fm=fm||cm();const un=debtors(fm);if(!un.length)return toast('Tất cả đã nộp đủ học phí đến '+mLabel(fm));
  sheet(`<h3>Nhắc học phí</h3><p class="sub">${un.length} phụ huynh còn nợ tính đến ${mLabel(fm)}, tổng <b>${money(un.reduce((a,x)=>a+x.o.total,0))}</b>. Bấm từng em để soạn tin riêng (kèm mã QR nếu có).</p><div class="list">${un.map(({s,o})=>`<div class="row"><i class="av">${esc(initial(s.name))}</i><div class="gr"><b>${esc(s.name)}</b><small>Còn ${money(o.total)}${o.months.length>1?' · '+mList(o.months.map(e=>e.m)):''}${s.pp?'':' · chưa có SĐT'}</small></div><button class="btn sm" data-a="nhac" data-id="${s.id}">Soạn tin</button></div>`).join('')}</div>`)}
async function qrImage(s){const st=S.set,o=dueInfo(s),ms=o.months.map(e=>e.m),m=QR.encode(vietqr(st.bin,st.acc,o.total,payInfo(s,ms))),n=m.length,sc=10,q=4,W=(n+2*q)*sc,H=W+120;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';

/* ---------- Mã hóa (Web Crypto) ---------- */
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
async function pbkdf(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits','deriveKey']);return{k,p:{name:'PBKDF2',salt,iterations:it,hash:'SHA-256'}}}
async function pinHash(pin,salt){const{k,p}=await pbkdf(pin,b64d(salt),150000);return b64e(new Uint8Array(await crypto.subtle.deriveBits(p,k,256)))}
async function aesKey(pw,salt){const{k,p}=await pbkdf(pw,salt,250000);return crypto.subtle.deriveKey(p,k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptK(txt,key,salt){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(txt));return{enc:1,salt,iv:b64e(iv),data:b64e(new Uint8Array(ct))}}
async function decryptK(o,key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},key,b64d(o.data)))}
async function encrypt(txt,pw){const salt=rnd(16);return encryptK(txt,await aesKey(pw,salt),b64e(salt))}
async function decrypt(o,pw){return decryptK(o,await aesKey(pw,b64d(o.salt)))}

/* ---------- Lưu file ra máy ---------- */
async function saveFile(blob,name,share){
  if(share){const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return true}catch(e){if(e&&e.name==='AbortError')return false}}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Đã tải file '+name);return true}
function backupForm(){sheet(`<h3>Sao lưu dữ liệu</h3><p class="sub">Tạo 1 file chứa toàn bộ lớp, học sinh, điểm danh, học phí. Cất vào Google Drive, iCloud hoặc "Cloud của tôi" trên Zalo.</p><label>Mật khẩu bảo vệ file (nên đặt)<input id="bp" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự"></label><p class="hint">${hasCrypto()?'Có mật khẩu: người khác cầm được file cũng không đọc được. <b>Quên mật khẩu là không mở được file.</b>':'Trình duyệt này không hỗ trợ mã hóa, file sẽ không có mật khẩu.'}</p><div class="acts"><button class="btn" data-a="dobk" data-v="share">Chia sẻ / lưu file</button><button class="btn gh" data-a="dobk" data-v="dl">Tải xuống</button></div>`)}
async function doBackup(mode){const pw=($('#bp')||{}).value||'';if(pw&&pw.length<6)return toast('Mật khẩu cần ít nhất 6 ký tự');
  const txt=JSON.stringify(S);let obj={app:'lop-hoc',v:2,at:new Date().toISOString()};
  if(pw&&hasCrypto())Object.assign(obj,await encrypt(txt,pw));else obj.data=S;
  const ok=await saveFile(new Blob([JSON.stringify(obj)],{type:'application/json'}),`so-lop-sao-luu-${today()}${obj.enc?'-mahoa':''}.json`,mode==='share');
  if(ok){S.lastBackup=Date.now();save();closeSh();render()}}

function fromOld(d){const months=[...Object.keys(d.paid||{}).map(k=>k.slice(0,7)),...Object.keys(d.att||{}).map(k=>k.slice(0,7))].sort(),first=months[0]||cm();
  const n=BLANK();n.classes=(d.classes||[]).map(c=>({id:c.id,name:c.name,days:c.days||[],start:c.start||'17:30',end:c.end||'19:00',place:c.place||'',fees:[{from:first,fee:+c.fee||0}]}));
  n.students=(d.students||[]).map(s=>({id:s.id,name:s.name,classId:s.classId,pr:s.pr||'',pn:s.pn||'',pp:s.pp||'',note:s.pt||'',fees:[],from:first}));
  for(const k in d.paid||{}){if(!d.paid[k])continue;const[m,sid]=k.split('|'),s=n.students.find(x=>x.id===sid);if(s)n.pays.push({id:uid(),sid,month:m,amount:classFee(n.classes.find(c=>c.id===s.classId),m),date:m+'-01',how:''})}
  for(const k in d.att||{}){const r=d.att[k],m={};for(const sid in r)m[sid]=r[sid]?'c':'k';n.att[k]={m,n:{}}}
  return n}
async function doRestore(text){let d;try{d=JSON.parse(text)}catch(e){return toast('Nội dung không phải bản sao lưu hợp lệ')}
  try{if(d.enc){const pw=$('#rp').value;if(!pw)return toast('File có mã hóa, hãy nhập mật khẩu');d=JSON.parse(await decrypt(d,pw))}else if(d.app==='lop-hoc'&&d.data)d=d.data}catch(e){return toast('Sai mật khẩu hoặc file bị hỏng')}
  if(!d||!Array.isArray(d.classes)||!Array.isArray(d.students))return toast('Bản sao lưu không hợp lệ');
  const n=normalize(d.v===2?d:fromOld(d));const pin=S.pin;S=n;S.pin=pin;S.lastBackup=Date.now();closeSh();keep();toast(`Đã khôi phục ${S.classes.length} lớp, ${S.students.length} học sinh`)}

document.addEventListener('input',e=>{const t=e.target;if(t.dataset.note&&cur)cur.n[t.dataset.note]=t.value;
  if(t.dataset.cmt&&cur)cur.c[t.dataset.cmt]=t.value;if(t.id==='at'&&cur)cur.t=t.value;
  if(t.id==='q'){qStu=t.value;$('#stul').innerHTML=stuList()}
  if(t.id==='hq'){qHome=t.value;$('#hres').innerHTML=homeSearch()}
  if(['n1','n2','n3','n4'].includes(t.id))$('#nm').value=annText();
  if(t.classList&&t.classList.contains('money')){const d=t.value.replace(/\D/g,'');t.value=d?Number(d).toLocaleString('vi-VN'):'';const h=t.parentElement.querySelector('.mhint')||t.insertAdjacentElement('afterend',Object.assign(document.createElement('span'),{className:'mhint hint'}));const v=+d||0;h.textContent=v&&v<10000?'⚠️ Chỉ '+money(v)+'? Hãy gõ đủ số 0, ví dụ 800000 → 800.000đ':v?'= '+money(v):''}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='ad'&&t.value&&cur)openAtt(cur.cid,t.value);if(t.closest&&t.closest('.pill'))t.closest('.pill').classList.toggle('on',t.checked);
  if(t.id==='n0'){ann.cid=t.value;announce(ann.cid)}
  if(['n1','n2','n3'].includes(t.id))$('#nm').value=annText();
  if(t.id==='fileIn'&&t.files[0]){const f=t.files[0];t.value='';f.text().then(txt=>{const rb=$('#rb');if(rb){rb.value=txt;toast('Đã đọc file. Nhập mật khẩu nếu có rồi bấm Khôi phục')}})}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pi')A.unlock()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){lock();save()}else{if(tab==='home'&&!shOpen&&!qHome)render();if(SC.on&&tokOK())syncNow(false)}});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='more')render()});

/* =========================================================
   ĐỒNG BỘ GOOGLE DRIVE (tùy chọn)
   - Dữ liệu được MÃ HÓA trên máy bằng "mật khẩu đồng bộ" rồi mới gửi lên Drive
     của chính người dùng. Google và Đ-LAB đều không đọc được.
   - Quyền drive.file: app chỉ thấy đúng file do app tạo, không xem được file khác trong Drive.
   - Ghép dữ liệu theo từng bản ghi: bản nào sửa sau cùng thì được giữ.
   ========================================================= */
const GOOGLE_CLIENT_ID='932946735251-m8uaa90ca5mmcfiu76qigli2oggrh718.apps.googleusercontent.com'; // Client ID công khai (không phải mật khẩu)
const SYNC_FILE='so-lop-dong-bo.json', SYNC_KEY='so-lop-sync';
const SCOPE='https://www.googleapis.com/auth/drive.file';
// SC.salt: "muối" của khóa mã hóa (dùng chung mọi máy, ghi trong file trên Drive).
// Không lưu mật khẩu đồng bộ: chỉ lưu khóa mã hóa đã tạo từ mật khẩu, dạng "không xuất ra được"
// (CryptoKey trong IndexedDB) — kẻ gian có lấy được máy cũng không đọc ngược ra mật khẩu.
// Bản cũ (≤1.3.2) lưu SC.pass: lần đồng bộ đầu tiên sẽ đổi sang khóa rồi xóa mật khẩu đi.
let SC={on:false,fileId:'',email:'',last:0,salt:''};try{SC={...SC,...JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')}}catch(e){}
const saveSC=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SC))}catch(e){}};
let tok=null,tokExp=0,syncing=false,syncAgain=false,syncErr='',syncT=null,gisP=null,SKEY=null;
const MISMATCH='Mật khẩu đồng bộ không khớp với dữ liệu đã có trên Google Drive';
async function useKey(key,salt){SKEY=key;SC.salt=salt;delete SC.pass;saveSC();await kvPut('synckey',key)}
function syncReset(){clearTimeout(syncT);SC={on:false,fileId:'',email:'',last:0,salt:''};saveSC();SKEY=null;tok=null;syncErr='';kvPut('synckey',undefined)}
const tokOK=()=>tok&&Date.now()<tokExp-60000;

// Ghi dấu thời gian sửa (u) cho từng bản ghi, và "bia mộ" (del) cho bản ghi đã xóa
let snap=null;
function recs(st){const m={};(st.classes||[]).forEach(c=>m['c:'+c.id]=c);(st.students||[]).forEach(s=>m['s:'+s.id]=s);(st.pays||[]).forEach(p=>m['p:'+p.id]=p);for(const k in st.att||{})m['a:'+k]=st.att[k];if(st.set)m['set']=st.set;return m}
const sig=o=>{const{u,...r}=o;return JSON.stringify(r)};
function stamp(){const now=Date.now(),cur=recs(S),ns={};S.del=S.del||{};
  for(const k in cur){const j=sig(cur[k]);ns[k]=j;if(snap&&snap[k]!==j)cur[k].u=now;delete S.del[k]}
  if(snap)for(const k in snap)if(!(k in cur))S.del[k]=now;
  for(const k in S.del)if(now-S.del[k]>90*864e5)delete S.del[k];
  snap=ns}
function resetSnap(){snap=null;stamp()}
function merge(L,R){const a=recs(L),b=recs(R),del={...(R.del||{})};for(const k in L.del||{})del[k]=Math.max(del[k]||0,L.del[k]);
  const pick={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{const x=a[k],y=b[k];const w=!x?y:!y?x:((y.u||0)>(x.u||0)?y:x);if(del[k]&&del[k]>=(w.u||0))return;pick[k]=w});
  const order=(arr,pre)=>{const ids=arr.map(o=>o.id);Object.keys(pick).filter(k=>k.startsWith(pre)).forEach(k=>{const id=k.slice(2);if(!ids.includes(id))ids.push(id)});return ids.filter(id=>pick[pre+id]).map(id=>pick[pre+id])};
  const n={...L,classes:order(L.classes,'c:'),students:order(L.students,'s:'),pays:order(L.pays,'p:'),att:{},set:pick.set||L.set,del};
  for(const k in pick)if(k.startsWith('a:'))n.att[k.slice(2)]=pick[k];
  return n}

function loadGIS(){if(window.google&&google.accounts)return Promise.resolve();if(gisP)return gisP;
  gisP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=ok;s.onerror=()=>{gisP=null;no(new Error('Không tải được Google, kiểm tra mạng'))};document.head.appendChild(s)});return gisP}
async function getToken(){await loadGIS();return new Promise((ok,no)=>{
  const c=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPE,
    callback:r=>{if(r.error)return no(new Error(r.error));tok=r.access_token;tokExp=Date.now()+(+r.expires_in||3600)*1000;ok()},
    error_callback:e=>no(new Error(e&&e.type==='popup_closed'?'Đã đóng cửa sổ đăng nhập':'Không đăng nhập được Google'))});
  c.requestAccessToken({prompt:SC.email?'':'consent',login_hint:SC.email||undefined})})}
async function gapi(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});
  if(r.status===401){tok=null;throw new Error('Phiên đăng nhập Google đã hết, bấm Đồng bộ để đăng nhập lại')}
  if(!r.ok)throw new Error('Google Drive báo lỗi '+r.status);return r}
async function findFile(){const q=encodeURIComponent(`name='${SYNC_FILE}' and trashed=false`);const j=await(await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`)).json();return j.files&&j.files[0]?j.files[0].id:''}
async function upload(body){const txt=JSON.stringify(body);
  if(SC.fileId){await gapi(`https://www.googleapis.com/upload/drive/v3/files/${SC.fileId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:txt});return}
  const bd='solop'+Date.now(),meta={name:SYNC_FILE,mimeType:'application/json',description:'Dữ liệu Sổ Lớp (đã mã hóa). Đừng xóa file này nếu đang dùng đồng bộ.'};
  const j=await(await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},
    body:`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${txt}\r\n--${bd}--`})).json();SC.fileId=j.id;saveSC()}
const SHARED=st=>{const{pin,lastBackup,seen,savedAt,...r}=st;return r};   // không đồng bộ PIN và thông tin riêng của từng máy
// pass: mật khẩu vừa nhập (khi bật đồng bộ, hoặc khi app hỏi lại). Không có thì dùng khóa đã lưu.
async function syncNow(interactive,pass){
  if(!GOOGLE_CLIENT_ID||!SC.on)return;
  if(syncing){syncAgain=true;return}   // đang đồng bộ: chạy thêm một lượt khi xong, để không sót thay đổi mới
  if(!tokOK()){if(!interactive){syncErr='need';updSync();return}try{await getToken()}catch(e){syncErr=e.message;updSync();if(interactive)toast(e.message);return}}
  syncing=true;syncErr='';updSync();
  try{
    if(!SKEY)SKEY=await kvGet('synckey');
    if(!SC.email){try{const a=await(await gapi('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json();SC.email=a.user.emailAddress;saveSC()}catch(e){}}
    if(!SC.fileId)SC.fileId=await findFile();
    let remote=null;
    if(SC.fileId){const r=await gapi(`https://www.googleapis.com/drive/v3/files/${SC.fileId}?alt=media`).catch(e=>{if(/404/.test(e.message)){SC.fileId='';return null}throw e});
      if(r){const o=await r.json();
        const same=SKEY&&SC.salt===o.salt,pw=pass||SC.pass;   // khóa đã lưu dùng được nếu cùng "muối"
        if(!same&&!pw)throw new Error('pass');
        const key=same&&!pass?SKEY:await aesKey(pw,b64d(o.salt));
        try{remote=JSON.parse(await decryptK(o,key))}catch(e){throw new Error(pass||SC.pass?MISMATCH:'pass')}
        if(key!==SKEY)await useKey(key,o.salt)}}
    if(!SKEY||!SC.salt){const pw=pass||SC.pass;if(!pw)throw new Error('pass');const s=b64e(rnd(16));await useKey(await aesKey(pw,b64d(s)),s)}
    if(!SC.on)return;   // đã tắt đồng bộ trong lúc chờ mạng
    stamp();
    if(remote){const keepLocal={pin:S.pin,lastBackup:S.lastBackup,seen:S.seen};S=normalize({...merge(S,remote),...keepLocal});}
    const txt=JSON.stringify(S);try{localStorage.setItem(LS,txt)}catch(e){}saveQ=saveQ.then(()=>dbPut(txt));await saveQ;resetSnap();
    await upload({app:'so-lop',v:3,at:new Date().toISOString(),...(await encryptK(JSON.stringify(SHARED(S)),SKEY,SC.salt))});
    SC.last=Date.now();saveSC();if(!shOpen)render();
  }catch(e){syncErr=e.message;if(interactive&&syncErr!=='pass')toast(e.message)}
  finally{syncing=false;updSync();if(syncAgain){syncAgain=false;queueSync()}}}
function queueSync(){if(!SC.on||!tokOK())return updSync();if(syncing){syncAgain=true;return}clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),4000)}
function ago(t){const s=(Date.now()-t)/1000;return s<60?'vừa xong':s<3600?Math.floor(s/60)+' phút trước':s<86400?Math.floor(s/3600)+' giờ trước':new Date(t).toLocaleDateString('vi-VN')}
function syncChip(){if(!GOOGLE_CLIENT_ID||!SC.on)return'';const t=syncing?'Đang đồng bộ…':syncErr==='need'?'Bấm để đồng bộ':syncErr==='pass'?'Cần nhập lại mật khẩu đồng bộ':syncErr?'Lỗi đồng bộ, bấm thử lại':'Đã đồng bộ '+ago(SC.last);
  return`<button class="schip ${syncErr?'warn':''}" data-a="syncnow">${ic('cloud')}<span>${t}</span></button>`}
function updSync(){$$('.schip').forEach(e=>e.outerHTML=syncChip())}
function syncForm(){if(GOOGLE_CLIENT_ID)loadGIS().catch(()=>{});if(!GOOGLE_CLIENT_ID)return sheet('<h3>Đồng bộ Google Drive</h3><p class="sub">Tính năng đang được cài đặt, sẽ có trong bản cập nhật tới.</p>');
  if(SC.on&&syncErr==='pass')return sheet(`<h3>Nhập lại mật khẩu đồng bộ</h3><p class="sub">Dữ liệu trên Google Drive vừa được một máy khác lưu lại${SC.email?' ('+esc(SC.email)+')':''}. Nhập mật khẩu đồng bộ (giống trên các máy khác) để tiếp tục.</p><label>Mật khẩu đồng bộ<input id="sp3" type="password" autocomplete="current-password"></label><button class="btn" data-a="syncpass">Tiếp tục đồng bộ</button><button class="btn rd" data-a="syncoff">Tắt đồng bộ trên máy này</button>`);
  if(SC.on)return sheet(`<h3>Đồng bộ Google Drive</h3><div class="card ok">✓ Đang bật${SC.email?' · '+esc(SC.email):''}<br><small style="color:inherit">${SC.last?'Lần cuối: '+ago(SC.last):'Chưa đồng bộ lần nào'}</small></div>${syncErr&&syncErr!=='need'?`<p class="hint" style="color:var(--r)">${esc(syncErr)}</p>`:''}<button class="btn" data-a="syncnow">Đồng bộ ngay</button><button class="btn rd" data-a="syncoff">Tắt đồng bộ trên máy này</button><p class="hint">Tắt đồng bộ: dữ liệu trên máy này vẫn giữ nguyên, file trên Drive cũng không bị xóa.</p>`);
  sheet(`<h3>Đồng bộ Google Drive</h3><p class="sub">Dùng chung dữ liệu giữa điện thoại và máy tính. Dữ liệu được <b>mã hóa trên máy</b> rồi lưu vào <b>Google Drive của chính ${esc(S.set.xung)}</b>. Google và Đ-LAB đều không đọc được.</p>
  <label>Mật khẩu đồng bộ (ít nhất 8 ký tự)<input id="sp1" type="password" autocomplete="new-password"></label><label>Nhập lại mật khẩu<input id="sp2" type="password" autocomplete="new-password"></label>
  <p class="hint">⚠️ <b>Dùng cùng một mật khẩu trên mọi máy.</b> Quên mật khẩu là không mở được dữ liệu trên Drive (vẫn còn dữ liệu trên từng máy). Hãy ghi mật khẩu ra giấy và cất kỹ. App không lưu lại mật khẩu này.</p>
  <button class="btn" data-a="syncon">Đăng nhập Google & bật đồng bộ</button><p class="hint">App chỉ xin quyền truy cập <b>đúng file do Sổ Lớp tạo</b>, không xem được các file khác trong Drive.</p>`)}

/* ---------- Khởi động ---------- */
(async()=>{try{history.replaceState({tab:'home'},'')}catch(e){}await load();resetSnap();if(SC.on){syncErr='need';loadGIS().catch(()=>{})}document.title=S.set.title;if(S.pin&&typeof S.pin!=='object')S.pin=null;if(!S.set.ob&&(S.classes.length||S.students.length)){S.set.ob=1;save()}lock();render();if(!S.set.ob&&!S.pin)onboard();
  try{if(navigator.storage&&navigator.storage.persisted)persisted=await navigator.storage.persisted()}catch(e){}
  if(S.students.length)askPersist();
  if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  setInterval(()=>{if(tab==='home'&&!shOpen&&!document.hidden&&!qHome&&document.activeElement.tagName!=='INPUT')render()},60000);
})();
