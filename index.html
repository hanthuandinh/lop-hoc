<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- CSP: chỉ cho phép kết nối tới chính app và Google (khi bật đồng bộ Drive). Mọi máy chủ khác bị chặn. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#13306a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Lớp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Sổ Lớp by Đ-LAB: quản lý lớp dạy thêm. Dữ liệu chỉ lưu trên máy của bạn.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sổ Lớp</title>
<style>
:root{
  --bg:#f3f5fb;--card:#fff;--ink:#14213d;--mut:#6b7590;--ln:#e4e8f1;
  --navy:#13306a;--navy2:#2453b8;--sky:#1e9be9;--or:#f7931e;
  --pri:#13306a;--pri2:#e9eefa;--on:#fff;
  --ok:#1f9d63;--ok2:#e3f6ec;--r:#d64545;--r2:#fdeaea;--y:#b7791f;--y2:#fff4dc;
  --sh:0 1px 2px rgba(20,33,61,.05),0 4px 14px rgba(20,33,61,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1322;--card:#171f36;--ink:#e7ecf7;--mut:#9aa6c2;--ln:#273150;
  --pri:#7aa2ff;--pri2:#1f2a4b;--on:#0d1322;
  --ok:#4cc38a;--ok2:#163627;--r:#f07878;--r2:#3a1d22;--y:#e8b65a;--y2:#3a2f16;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;margin:4px 0 4px;letter-spacing:-.3px}
h2{margin:2px 0;font-size:19px}h3{margin:0 0 10px;font-size:19px;padding-right:40px}
p{margin:6px 0}
.sub,small{color:var(--mut);font-size:14px}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px;font-size:17px;font-weight:700}
.lbl a,.lbl button{font-size:14px;font-weight:600;color:var(--pri);background:none;border:0;font-family:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

/* Đầu trang */
.top{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f2a63 0%,#2453b8 65%,#1e9be9 100%);color:#fff;
  margin:calc(-16px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 54px;border-radius:0 0 28px 28px}
.top::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
.top::before{content:"";position:absolute;right:60px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(247,147,30,.18)}
.toprow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.toprow .gr{flex:1}
.top h1{color:#fff;font-size:24px;margin:0}
.top .hi{font-size:16px;font-weight:600;margin-top:2px}
.top small{color:rgba(255,255,255,.8)}
.ava{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2px solid rgba(255,255,255,.7);flex:none;cursor:pointer;padding:0;overflow:hidden}
.ava img{width:34px;height:auto}
.sbox{position:relative;margin:-26px 4px 0;z-index:2}
.sbox input{padding:14px 14px 14px 44px;border-radius:16px;border:0;box-shadow:0 6px 20px rgba(19,48,106,.14);background:var(--card)}
.sbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut)}

/* Lưới truy cập nhanh */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--tc) 18%,transparent);border-radius:18px;padding:12px 10px 12px 12px;
  background:var(--card);background:color-mix(in srgb,var(--tc) 9%,var(--card));color:var(--ink);font-family:inherit;cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:2px}
.tile .tic{width:40px;height:40px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;margin-bottom:8px}
.tile b{font-size:14.5px;line-height:1.25}
.tile small{font-size:12px;line-height:1.3;padding-right:14px}
.tile .chev{position:absolute;right:8px;bottom:10px;color:var(--mut);width:14px;height:14px}
.badge{position:absolute;right:8px;top:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--or);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.badge.new{background:#7c5ce6}

/* Thẻ & danh sách */
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.ok{background:var(--ok2);color:var(--ok);border:0;box-shadow:none}
.list{background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.gr{flex:1;min-width:0}.gr b{display:block;overflow-wrap:anywhere}.gr small{display:block}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc,#2453b8) 13%,var(--card));color:var(--tc,#2453b8)}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.dbad{width:54px;flex:none;text-align:center;border-radius:14px;padding:6px 0;background:color-mix(in srgb,var(--or) 13%,var(--card));color:var(--or)}
.dbad small{display:block;font-size:11px;font-weight:700;color:inherit;letter-spacing:.5px}
.dbad b{display:block;font-size:22px;line-height:1.1;color:var(--ink)}
.dbad span{font-size:11px;color:var(--mut)}
.dbad.today{background:var(--or);color:#fff}.dbad.today b,.dbad.today span{color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mut);font-size:13px;margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:4px}.meta svg.i{width:14px;height:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.r{background:var(--r2);color:var(--r)}.chip.y{background:var(--y2);color:var(--y)}.chip.or{background:color-mix(in srgb,var(--or) 15%,var(--card));color:var(--or)}
.bar{height:8px;background:var(--ln);border-radius:9px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--sky))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{border-radius:16px;padding:12px;background:var(--card);border:1px solid var(--ln)}
.stat b{display:block;font-size:20px}.stat small{font-size:12px}

/* Nút */
.btn{display:block;border:0;border-radius:14px;padding:12px 16px;font-family:inherit;font-size:16px;font-weight:600;background:var(--pri);color:var(--on);width:100%;margin-top:12px;text-align:center;text-decoration:none;cursor:pointer}
.btn.sm{display:inline-block;width:auto;margin:0;padding:8px 12px;font-size:14px}
.btn.gh{background:var(--pri2);color:var(--pri)}.btn.rd{background:var(--r2);color:var(--r)}.btn.ln{background:transparent;color:var(--pri);border:1px solid var(--ln)}
.btn.or{background:var(--or);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.acts .btn{margin:0;flex:1}.acts .btn.sm{flex:none}
.mo{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}
.big{font-size:30px;font-weight:800;color:var(--pri)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:5px;vertical-align:middle;background:var(--r2);color:var(--r)}.tag.y{background:var(--y2);color:var(--y)}

/* Form */
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px}
textarea{min-height:130px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;margin:0;padding:8px 11px;border:1px solid var(--ln);border-radius:12px;color:var(--ink);font-size:15px;cursor:pointer}
.pill input{width:auto;margin:0;display:inline}
.pill.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.qr{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px;margin-top:12px}
.qr>svg{border-radius:8px;flex:none;width:130px;height:130px}
.btn svg.i{width:16px;height:16px;margin:-2px 4px 0 0}

/* Điểm danh */
.arow{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--ok2);color:var(--ok)}
.att-p .mark{background:var(--y2);color:var(--y)}.att-k .mark{background:var(--r2);color:var(--r)}
.att-p,.att-k{background:color-mix(in srgb,var(--r2) 40%,transparent)}
.note{flex-basis:100%;margin:0}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin:12px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--sky),var(--navy2));border-radius:5px 5px 0 0;min-height:2px}
.bars span{font-size:11px;color:var(--mut);margin-top:3px}

/* Thanh điều hướng dưới (điện thoại) */
#bot{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
#bot button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 7px;font-family:inherit;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#bot button.on{color:var(--pri);font-weight:700}
#bot button.on svg{stroke-width:2.4}
/* Menu bên trái (máy tính) */
#side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.brand img{width:44px}
.brand b{display:block;font-size:20px;color:var(--navy)}
.brand small{font-size:12px}
@media(prefers-color-scheme:dark){.brand b{color:#fff}}

/* Bảng trượt */
#sh{position:fixed;inset:0;z-index:10}
.bk{position:absolute;inset:0;background:rgba(8,15,35,.5)}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;overscroll-behavior:contain}
.x{position:absolute;right:14px;top:14px;border:0;background:var(--pri2);color:var(--pri);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#14213d;color:#fff;padding:10px 14px;border-radius:14px;z-index:30;font-size:14px;max-width:92%;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#ts button{border:0;background:none;color:#ffb35c;font-weight:700;font-family:inherit;font-size:14px;cursor:pointer}
#lk{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#0f2a63,#2453b8);color:#fff;display:grid;place-items:center;padding:24px}
#lk>div{width:100%;max-width:320px;text-align:center}
#lk input{text-align:center;font-size:24px;letter-spacing:8px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
#lk .btn{background:var(--or);color:#fff}
#lk .logo{background:#fff;border-radius:20px;padding:14px;width:84px;margin:0 auto 12px}
.about img.full{width:100%;max-width:360px;display:block;margin:6px auto 4px;background:#fff;border-radius:16px;padding:10px}
.schip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:0;border-radius:20px;padding:6px 12px;background:rgba(255,255,255,.16);color:#fff;font-family:inherit;font-size:13px;cursor:pointer}.schip svg.i{width:15px;height:15px}.schip.warn{background:var(--or)}
[hidden]{display:none!important}

/* Máy tính / màn hình rộng */
@media(min-width:900px){
  body{display:grid;grid-template-columns:250px 1fr}
  #side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--card);border-right:1px solid var(--ln)}
  #side nav{display:flex;flex-direction:column;gap:4px}
  #side nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--mut);padding:11px 12px;border-radius:12px;font-family:inherit;font-size:15px;cursor:pointer;text-align:left}
  #side nav button:hover{background:var(--bg)}
  #side nav button.on{background:var(--pri2);color:var(--pri);font-weight:700}
  #side .foot{margin-top:auto;font-size:12px;color:var(--mut);padding:0 8px}
  #bot{display:none}
  main{max-width:1120px;width:100%;padding:28px 36px 48px}
  .top{margin:0;border-radius:24px;padding:26px 28px 60px}
  .top .ava{display:none}
  .sbox{margin:-28px 28px 0;max-width:520px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .tile{min-height:126px;padding:16px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .wide .list,.wide{column-gap:22px}
  .pn{top:50%;bottom:auto;transform:translateY(-50%);border-radius:24px;max-height:86vh;width:600px;padding:24px}
  #ts{bottom:28px}
  .stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><img src="mark.png" alt=""><div><b>Sổ Lớp</b><small>by Đ-LAB</small></div></div>
  <nav id="sidenav"></nav>
  <div class="foot">Dữ liệu của bạn, do bạn giữ.<br>Đ-LAB · Nơi ý tưởng được tạo nên</div>
</aside>
<main id="app"></main>
<nav id="bot"></nav>
<div id="sh" hidden></div><div id="lk" hidden></div><div id="ts" hidden></div>
<input id="fileIn" type="file" accept=".json,application/json,text/plain" hidden>
<script src="qr.js"></script>
<script>
'use strict';
/* =========================================================
   SỔ LỚP · by Đ-LAB — quản lý lớp dạy thêm
   Chạy 100% trên máy, không gửi dữ liệu đi đâu.
   Dữ liệu lưu trong IndexedDB (kho của trình duyệt) + bản dự phòng localStorage.
   ========================================================= */
const VERSION='1.2.0';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('vi-VN')+'đ';
const DN=['CN','T2','T3','T4','T5','T6','T7'], DNF=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>ymd(new Date());
const cm=()=>today().slice(0,7);
const shiftM=(m,k)=>{const[y,n]=m.split('-').map(Number),d=new Date(y,n-1+k,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const mLabel=m=>'tháng '+Number(m.slice(5))+'/'+m.slice(0,4);
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dLabel=s=>{const t=toDate(s);return DN[t.getDay()]+' '+t.getDate()+'/'+(t.getMonth()+1)};
const dLong=s=>{const t=toDate(s);return DNF[t.getDay()]+', ngày '+t.getDate()+'/'+(t.getMonth()+1)};
const nowHM=()=>{const t=new Date();return p2(t.getHours())+':'+p2(t.getMinutes())};
const digits=p=>String(p||'').replace(/\D/g,'');
const phoneLocal=p=>{let d=digits(p);if(d.startsWith('84')&&d.length>=11)d='0'+d.slice(2);return d};
const initial=n=>(String(n).trim().split(/\s+/).pop()||'?').slice(0,1).toUpperCase();
const ascii=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

/* ---------- Biểu tượng (vẽ bằng SVG, dựa trên bộ Feather) ---------- */
const IC={
 home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
 book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 check:'<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 card:'<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
 bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
 msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/>',
 chart:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',

const BANKS=[['970436','Vietcombank'],['970415','VietinBank'],['970418','BIDV'],['970405','Agribank'],['970407','Techcombank'],['970422','MB Bank'],['970416','ACB'],['970432','VPBank'],['970423','TPBank'],['970403','Sacombank'],['970441','VIB'],['970443','SHB'],['970437','HDBank'],['970448','OCB'],['970426','MSB'],['970440','SeABank'],['970449','LPBank'],['970431','Eximbank'],['970428','Nam A Bank'],['970409','Bac A Bank'],['970454','BVBank'],['970452','KienlongBank'],['970412','PVcomBank'],['970425','ABBANK']];
function tlv(id,v){return id+p2(v.length)+v}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function vietqr(bin,acc,amount,info){const mai=tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',acc))+tlv('02','QRIBFTTA');
  let s=tlv('00','01')+tlv('01',amount?'12':'11')+tlv('38',mai)+tlv('53','704')+(amount?tlv('54',String(Math.round(amount))):'')+tlv('58','VN')+(info?tlv('62',tlv('08',info)):'')+'6304';return s+crc16(s)}

const LS='lop-hoc-v2', DBN='lop-hoc', ST='kv';
const BLANK=()=>({v:2,set:{title:'Sổ Lớp',xung:'Thầy',name:'',bank:'',bin:'',acc:'',holder:''},classes:[],students:[],att:{},pays:[],pin:null,lastBackup:0,savedAt:0,seen:{}});
let S=BLANK();
function normalize(d){const b=BLANK();d=d||{};const n={...b,...d,set:{...b.set,...(d.set||{})},classes:d.classes||[],students:d.students||[],att:d.att||{},pays:d.pays||[],seen:d.seen||{}};
  if(n.set.title==='Lớp của thầy Định'){n.set.title='Sổ Lớp';if(!n.set.name)n.set.name='Định'}
  if(!n.set.bin&&n.set.bank){const f=BANKS.find(x=>x[1].toLowerCase()===n.set.bank.toLowerCase());if(f)n.set.bin=f[0]}
  return n}
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function dbGet(){try{const d=await idb();return await new Promise((ok,no)=>{const q=d.transaction(ST).objectStore(ST).get('state');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){return null}}
async function dbPut(txt){try{const d=await idb();await new Promise((ok,no)=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(txt,'state');t.oncomplete=ok;t.onerror=()=>no(t.error)})}catch(e){}}
let saveQ=Promise.resolve();
function save(){if(typeof stamp==='function')stamp();S.savedAt=Date.now();const txt=JSON.stringify(S);try{localStorage.setItem(LS,txt)}catch(e){}saveQ=saveQ.then(()=>dbPut(txt));askPersist();if(typeof queueSync==='function')queueSync()}
async function load(){let a=null,b=null;try{const t=await dbGet();if(t)a=JSON.parse(t)}catch(e){}try{const t=localStorage.getItem(LS);if(t)b=JSON.parse(t)}catch(e){}
  S=normalize([a,b].filter(Boolean).sort((x,y)=>(y.savedAt||0)-(x.savedAt||0))[0])}

async function askPersist(){try{if(persisted||!navigator.storage||!navigator.storage.persist)return;persisted=await navigator.storage.persisted()||await navigator.storage.persist()}catch(e){}}

// Lịch sử học phí [{from:'YYYY-MM',fee}]: đổi học phí không làm sai các tháng cũ
function feeAt(list,m,strict){if(!list||!list.length)return null;const a=[...list].sort((x,y)=>x.from<y.from?-1:1);let f=strict?null:a[0].fee;for(const e of a)if(e.from<=m)f=e.fee;return f}
const classFee=(c,m)=>c?(feeAt(c.fees,m)||0):0;
function stuFee(s,m){const own=feeAt(s.fees,m,true);return own!=null?own:classFee(cls(s.classId),m)}
const enrolled=(s,m)=>(s.from||'0000-00')<=m&&(!s.left||m<=s.left);
const classStu=cid=>S.students.filter(s=>s.classId===cid&&!s.left).sort((a,b)=>a.name.localeCompare(b.name,'vi'));
const paidOf=(sid,m)=>S.pays.filter(p=>p.sid===sid&&p.month===m).reduce((a,p)=>a+(+p.amount||0),0);
function feeState(s,m){const due=enrolled(s,m)?stuFee(s,m):0,paid=paidOf(s.id,m);return{due,paid,rest:Math.max(0,due-paid),st:due<=0?(paid>0?'ok':'free'):paid>=due?'ok':paid>0?'part':'no'}}
const unpaid=m=>S.students.filter(s=>['no','part'].includes(feeState(s,m).st));
const dayTxt=c=>c.days.slice().sort((a,b)=>(a+6)%7-(b+6)%7).map(d=>DN[d]).join(', ');
const AK=(d,cid)=>d+'|'+cid;
function stuAtt(sid,pred){let c=0,p=0,k=0;for(const key in S.att){const v=S.att[key].m&&S.att[key].m[sid];if(!v)continue;if(pred&&!pred(key.slice(0,10)))continue;v==='c'?c++:v==='p'?p++:k++}return{c,p,k,t:c+p+k}}
function absentStreak(sid){const ds=[];for(const key in S.att){const v=S.att[key].m&&S.att[key].m[sid];if(v)ds.push([key.slice(0,10),v])}ds.sort((a,b)=>a[0]<b[0]?1:-1);let n=0;for(const[,v]of ds){if(v==='c')break;n++}return n}
function sessions(days){const t=new Date(),out=[];for(let i=0;i<days;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);S.classes.filter(c=>c.days.includes(d.getDay())).sort((a,b)=>a.start<b.start?-1:1).forEach(c=>{if(i>0||c.end>nowHM()||S.att[AK(ymd(d),c.id)])out.push({d,i,c})})}return out}

  sheet(`<h3>${c?'Sửa lớp':'Thêm lớp mới'}</h3><label>Tên lớp<input id="f1" value="${esc(c?c.name:'')}" placeholder="Tin học · Lớp 4"></label><label>Ngày học trong tuần</label><div class="days">${[1,2,3,4,5,6,0].map(d=>`<label class="pill ${days.includes(d)?'on':''}"><input type="checkbox" value="${d}" ${days.includes(d)?'checked':''}>${DN[d]}</label>`).join('')}</div><div class="two"><label>Bắt đầu<input id="f2" type="time" value="${c?c.start:'17:30'}"></label><label>Kết thúc<input id="f3" type="time" value="${c?c.end:'19:00'}"></label></div><label>Địa điểm<input id="f4" value="${esc(c?c.place:'')}" placeholder="Tại nhà"></label><label>Học phí mỗi tháng (đồng)<input id="f5" type="number" inputmode="numeric" min="0" step="1000" value="${c?classFee(c,m):''}" placeholder="800000"></label>${c?`<label>Học phí mới áp dụng từ tháng<input id="f6" type="month" value="${m}"></label><p class="hint">Các tháng trước đó vẫn giữ học phí cũ.</p>`:''}<button class="btn" data-a="savecls" data-id="${c?c.id:''}">Lưu lớp</button>${c?`<button class="btn rd" data-a="delcls" data-id="${c.id}">Xóa lớp</button>`:''}`)}
function saveCls(id){const n=$('#f1').value.trim(),d=$$('.days input:checked').map(x=>+x.value),fee=Math.max(0,+$('#f5').value||0),st=$('#f2').value||'17:30',en=$('#f3').value||'19:00';

  const base={name:n,days:d,start:st,end:en,place:$('#f4').value.trim()};
  if(id){const c=cls(id);Object.assign(c,base);const from=$('#f6').value||cm();if(classFee(c,from)!==fee){c.fees=c.fees.filter(e=>e.from!==from);c.fees.push({from,fee})}toast('Đã lưu lớp')}
  else{S.classes.push({id:uid(),...base,fees:[{from:cm(),fee}]});toast('Đã thêm lớp '+n)}
  closeSh();keep()}

/* ---------- Học sinh ---------- */
function stuRow(s){const m=cm(),a=stuAtt(s.id,d=>d.slice(0,7)===m),k=absentStreak(s.id);
  return`<div class="row"><i class="av">${esc(initial(s.name))}</i><div class="gr"><b>${esc(s.name)}${k>=2?`<span class="tag">vắng ${k} buổi liền</span>`:''}${feeAt(s.fees,m,true)!=null?'<span class="tag y">HP riêng</span>':''}</b><small>${a.t?`Tháng này: có mặt ${a.c}/${a.t} buổi`:'Tháng này chưa có điểm danh'}</small>${s.pp?`<small>${esc(s.pr||'Phụ huynh')}${s.pn?' '+esc(s.pn):''} · ${esc(s.pp)}</small>`:''}${s.note?`<small>📌 ${esc(s.note)}</small>`:''}</div>${s.pp?`<a class="btn sm gh" href="tel:${phoneLocal(s.pp)}" aria-label="Gọi">${ic('phone')}</a>`:''}<button class="btn sm gh" data-a="edstu" data-id="${s.id}">Sửa</button></div>`}
function stuList(){const q=qStu.trim().toLowerCase(),d=digits(q),f=s=>!q||s.name.toLowerCase().includes(q)||(d&&digits(s.pp).includes(d));let h='';
  S.classes.forEach(c=>{const st=classStu(c.id).filter(f);if(q&&!st.length)return;h+=`<div><div class="lbl">${esc(c.name)} <small>${st.length} học sinh</small></div><div class="list">${st.map(stuRow).join('')||'<div class="row"><small>Lớp chưa có học sinh</small></div>'}</div></div>`});
  const orphan=S.students.filter(s=>!s.left&&!cls(s.classId)).filter(f);if(orphan.length)h+=`<div><div class="lbl">Chưa xếp lớp <small>${orphan.length}</small></div><div class="list">${orphan.map(stuRow).join('')}</div></div>`;
  const gone=S.students.filter(s=>s.left).filter(f);if(gone.length)h+=`<div><div class="lbl">Đã nghỉ học <small>${gone.length}</small></div><div class="list">${gone.map(stuRow).join('')}</div></div>`;
  return h?`<div class="cols">${h}</div>`:'<div class="card">Không tìm thấy học sinh nào.</div>'}
function vStudents(){return`<h1>Học sinh</h1><p class="sub">${S.students.filter(s=>!s.left).length} em đang học · ${S.classes.length} lớp</p>${S.students.length>5?`<div class="sbox" style="margin:12px 0 0">${ic('search')}<input id="q" type="search" placeholder="Tìm theo tên hoặc số điện thoại" value="${esc(qStu)}"></div>`:''}<div id="stul">${stuList()}</div><button class="btn gh" data-a="addstu">+ Thêm học sinh</button>`}
function addStuForm(cid){if(!S.classes.length)return toast('Hãy thêm lớp trước');
  sheet(`<h3>Thêm học sinh</h3><label>Lớp<select id="g1">${S.classes.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Danh sách học sinh, mỗi dòng một em<textarea id="g2" placeholder="Nguyễn Văn An - 0912345678&#10;Trần Thị Bình"></textarea></label><p class="hint">Có thể ghi kèm số điện thoại phụ huynh sau dấu gạch ngang. Dán thẳng danh sách từ Excel hoặc Zalo cũng được.</p><button class="btn" data-a="savestu">Lưu</button>`)}
function saveStu(){const cid=$('#g1').value,lines=$('#g2').value.split(/\r?\n/).map(x=>x.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);
  if(!lines.length)return toast('Nhập ít nhất một tên');
  lines.forEach(l=>{let name=l,pp='';const mm=l.match(/^(.*?)[\s,;:\t\-–]+(\+?\d[\d .]{7,}\d)$/);if(mm){name=mm[1].trim();pp=mm[2].replace(/\s|\./g,'')}if(name)S.students.push({id:uid(),name,classId:cid,pp,pr:'',pn:'',note:'',fees:[],from:cm()})});
  closeSh();keep();toast('Đã thêm '+lines.length+' học sinh')}
function edStuForm(s){const m=cm(),own=feeAt(s.fees,m,true),c=cls(s.classId);
  sheet(`<h3>Sửa học sinh</h3><label>Họ tên<input id="e1" value="${esc(s.name)}"></label><label>Lớp<select id="e2">${S.classes.map(c=>`<option value="${c.id}" ${c.id===s.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><div class="two"><label>Phụ huynh là<input id="e3" value="${esc(s.pr)}" placeholder="Mẹ, Ba, Bà…"></label><label>Tên phụ huynh<input id="e4" value="${esc(s.pn)}"></label></div><label>Số điện thoại (Zalo)<input id="e5" type="tel" inputmode="tel" value="${esc(s.pp)}"></label><label>Ghi chú<input id="e6" value="${esc(s.note)}" placeholder="Đón con lúc 19:00, dị ứng…"></label><label>Học phí riêng / tháng (để trống = theo lớp${c?': '+money(classFee(c,m)):''})<input id="e7" type="number" inputmode="numeric" min="0" step="1000" value="${own!=null?own:''}" placeholder="Ví dụ giảm cho anh chị em"></label><div class="two"><label>Áp dụng từ tháng<input id="e8" type="month" value="${m}"></label><label>Bắt đầu học từ<input id="e9" type="month" value="${s.from||m}"></label></div><button class="btn" data-a="saveed" data-id="${s.id}">Lưu</button><div class="acts">${s.left?`<button class="btn gh" data-a="back" data-id="${s.id}">Học trở lại</button>`:`<button class="btn ln" data-a="leave" data-id="${s.id}">Cho nghỉ học</button>`}<button class="btn rd" data-a="delstu" data-id="${s.id}">Xóa hẳn</button></div><p class="hint">"Cho nghỉ học" giữ lại lịch sử học phí và điểm danh. "Xóa hẳn" xóa mọi dữ liệu của em này.</p>`)}
function saveEd(id){const s=stuById(id),n=$('#e1').value.trim();if(!n)return toast('Tên không được để trống');
  Object.assign(s,{name:n,classId:$('#e2').value,pr:$('#e3').value.trim(),pn:$('#e4').value.trim(),pp:$('#e5').value.trim(),note:$('#e6').value.trim(),from:$('#e9').value||s.from||cm()});
  const v=$('#e7').value.trim(),from=$('#e8').value||cm(),cur0=feeAt(s.fees,from,true),nv=v===''?null:Math.max(0,+v||0);
  if(cur0!==nv){s.fees=(s.fees||[]).filter(e=>e.from!==from);s.fees.push({from,fee:nv})}

/* ---------- Điểm danh: 'c' có mặt, 'p' vắng có phép, 'k' vắng không phép ---------- */
let cur=null;
function attPick(){const t=new Date(),td=S.classes.filter(c=>c.days.includes(t.getDay()));if(!S.classes.length)return toast('Hãy thêm lớp trước');if(td.length===1)return openAtt(td[0].id,today());
  const list=[...td,...S.classes.filter(c=>!td.includes(c))];
  sheet(`<h3>Điểm danh lớp nào?</h3><div class="list">${list.map(c=>`<div class="row"><span class="ic" style="--tc:${td.includes(c)?'#f7931e':'#2453b8'}">${ic('book')}</span><div class="gr"><b>${esc(c.name)}</b><small>${td.includes(c)?'Hôm nay · ':''}${dayTxt(c)} · ${c.start} – ${c.end}</small></div><button class="btn sm ${td.includes(c)?'':'gh'}" data-a="att" data-id="${c.id}">Chọn</button></div>`).join('')}</div>`)}
function openAtt(cid,date){const c=cls(cid);if(!c)return;const r=S.att[AK(date,cid)];
  const ids=new Set(classStu(cid).filter(s=>enrolled(s,date.slice(0,7))||!s.from).map(s=>s.id));if(r&&r.m)Object.keys(r.m).forEach(id=>{if(stuById(id))ids.add(id)});
  cur={cid,date,exist:!!r,ids:[...ids].sort((a,b)=>stuById(a).name.localeCompare(stuById(b).name,'vi')),m:{},n:{}};
  cur.ids.forEach(id=>{cur.m[id]=(r&&r.m[id])||'c';cur.n[id]=(r&&r.n&&r.n[id])||''});
  sheet(`<h3>Điểm danh · ${esc(c.name)}</h3><label>Ngày<input id="ad" type="date" value="${date}" max="${today()}"></label>${cur.exist?'<p class="sub">Ngày này đã điểm danh, đang sửa lại.</p>':''}<p class="hint">Cả lớp mặc định <b>có mặt</b>. Chạm vào bạn vắng: 1 lần = <b>vắng có phép (P)</b>, 2 lần = <b>vắng không phép (K)</b>, 3 lần = có mặt lại.</p><div class="list" style="margin-top:10px">${cur.ids.map(attRow).join('')||'<div class="row"><small>Lớp chưa có học sinh.</small></div>'}</div><div class="sub" id="asum">${attSum()}</div><button class="btn" data-a="saveatt">Lưu điểm danh</button>${cur.exist?'<button class="btn rd" data-a="delatt">Xóa buổi điểm danh này</button>':''}`)}
function attRow(id){const s=stuById(id),v=cur.m[id],L={c:['✓','Có mặt'],p:['P','Vắng có phép'],k:['K','Vắng không phép']}[v];
  return`<div class="row att-${v}" id="ar-${id}"><button class="arow" data-a="tog" data-id="${id}"><span class="mark">${L[0]}</span><span class="gr"><b>${esc(s.name)}</b><small>${L[1]}</small></span></button>${v!=='c'?`<input class="note" data-note="${id}" placeholder="Lý do (không bắt buộc)" value="${esc(cur.n[id])}">`:''}</div>`}
function attSum(){const v=Object.values(cur.m);return`Có mặt ${v.filter(x=>x==='c').length} · Có phép ${v.filter(x=>x==='p').length} · Không phép ${v.filter(x=>x==='k').length}`}

/* ---------- Học phí ---------- */
function vFees(){const list=S.students.filter(s=>enrolled(s,fm)||paidOf(s.id,fm)>0).map(s=>({s,f:feeState(s,fm)}));
  const exp=list.reduce((a,x)=>a+x.f.due,0),got=S.pays.filter(p=>p.month===fm).reduce((a,p)=>a+(+p.amount||0),0),nNo=list.filter(x=>['no','part'].includes(x.f.st)).length;
  let h=`<h1>Học phí</h1><div class="mo"><button class="btn sm gh" data-a="mo" data-v="-1" aria-label="Tháng trước">‹</button><b>${mLabel(fm).replace(/^t/,'T')}</b><button class="btn sm gh" data-a="mo" data-v="1" aria-label="Tháng sau">›</button></div><div class="card"><small>Đã thu</small><div class="big">${money(got)}</div><div class="bar"><i style="width:${exp?Math.min(100,got/exp*100):0}%"></i></div><div class="stats"><div class="stat"><small>Dự kiến</small><b>${money(exp)}</b></div><div class="stat"><small>Còn phải thu</small><b style="color:var(--r)">${money(Math.max(0,exp-got))}</b></div><div class="stat"><small>Chưa nộp đủ</small><b>${nNo} em</b></div></div>${nNo?'<button class="btn or" data-a="remindall">Nhắc tất cả phụ huynh chưa nộp</button>':''}</div>`;
  const grp=(t,st,chip)=>{const a=list.filter(x=>x.f.st===st);return a.length?`<div><div class="lbl">${t} <span class="chip ${chip}">${a.length}</span></div><div class="list">${a.map(feeRow).join('')}</div></div>`:''};
  if(!list.length)return h+'<div class="card">Tháng này chưa có học sinh nào.</div>';
  return h+`<div class="cols">`+grp('Chưa nộp','no','r')+grp('Nộp thiếu','part','y')+grp('Đã nộp đủ','ok','ok')+grp('Không tính phí','free','')+`</div>`}
function feeRow({s,f}){const c=cls(s.classId);
  return`<div class="row"><button class="arow" data-a="paydt" data-id="${s.id}"><i class="av">${esc(initial(s.name))}</i><span class="gr"><b>${esc(s.name)}</b><small>${esc(c?c.name:'')} · ${money(f.due)}${f.st==='part'?` · đã nộp ${money(f.paid)}, còn ${money(f.rest)}`:''}</small></span></button>${f.st==='no'||f.st==='part'?`<button class="btn sm gh" data-a="nhac" data-id="${s.id}">Nhắc</button><button class="btn sm" data-a="payfull" data-id="${s.id}">Thu ${f.st==='part'?'nốt':'đủ'}</button>`:f.st==='ok'?`<button class="btn sm gh" data-a="paydt" data-id="${s.id}">✓ Đã thu</button>`:''}</div>`}
function payDetail(s){const f=feeState(s,fm),ps=S.pays.filter(p=>p.sid===s.id&&p.month===fm);
  sheet(`<h3>${esc(s.name)} · ${mLabel(fm)}</h3><p class="sub">Phải nộp ${money(f.due)} · Đã nộp ${money(f.paid)} · Còn ${money(f.rest)}</p>${ps.length?`<div class="list">${ps.map(p=>`<div class="row"><div class="gr"><b>${money(p.amount)}</b><small>Ngày ${p.date.split('-').reverse().join('/')}${p.how?' · '+esc(p.how):''}</small></div><button class="btn sm rd" data-a="delpay" data-id="${p.id}">Xóa</button></div>`).join('')}</div>`:''}<label>Số tiền thu<input id="pa" type="number" inputmode="numeric" min="0" step="1000" value="${f.rest||''}"></label><div class="two"><label>Ngày thu<input id="pd" type="date" value="${today()}"></label><label>Hình thức<select id="ph"><option>Tiền mặt</option><option>Chuyển khoản</option></select></label></div><button class="btn" data-a="savepay" data-id="${s.id}">Lưu khoản thu</button>${f.rest?`<button class="btn gh" data-a="nhac" data-id="${s.id}">Soạn tin nhắc học phí</button>`:''}`)}

const payInfo=s=>ascii(s.name+' HP T'+Number(fm.slice(5))).slice(0,25);

/* ---------- Mã hóa (Web Crypto) ---------- */
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
async function pbkdf(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits','deriveKey']);return{k,p:{name:'PBKDF2',salt,iterations:it,hash:'SHA-256'}}}
async function pinHash(pin,salt){const{k,p}=await pbkdf(pin,b64d(salt),150000);return b64e(new Uint8Array(await crypto.subtle.deriveBits(p,k,256)))}
async function aesKey(pw,salt){const{k,p}=await pbkdf(pw,salt,250000);return crypto.subtle.deriveKey(p,k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(txt,pw){const salt=rnd(16),iv=rnd(12),key=await aesKey(pw,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(txt));return{enc:1,salt:b64e(salt),iv:b64e(iv),data:b64e(new Uint8Array(ct))}}
async function decrypt(o,pw){const key=await aesKey(pw,b64d(o.salt));return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},key,b64d(o.data)))}

/* ---------- Lưu file ra máy ---------- */
async function saveFile(blob,name,share){
  if(share){const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return true}catch(e){if(e&&e.name==='AbortError')return false}}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Đã tải file '+name);return true}

const GOOGLE_CLIENT_ID='932946735251-m8uaa90ca5mmcfiu76qigli2oggrh718.apps.googleusercontent.com'; // Client ID công khai (không phải mật khẩu)

const tokOK=()=>tok&&Date.now()<tokExp-60000;

// Ghi dấu thời gian sửa (u) cho từng bản ghi, và "bia mộ" (del) cho bản ghi đã xóa
let snap=null;
function recs(st){const m={};(st.classes||[]).forEach(c=>m['c:'+c.id]=c);(st.students||[]).forEach(s=>m['s:'+s.id]=s);(st.pays||[]).forEach(p=>m['p:'+p.id]=p);for(const k in st.att||{})m['a:'+k]=st.att[k];if(st.set)m['set']=st.set;return m}
const sig=o=>{const{u,...r}=o;return JSON.stringify(r)};
function stamp(){const now=Date.now(),cur=recs(S),ns={};S.del=S.del||{};
  for(const k in cur){const j=sig(cur[k]);ns[k]=j;if(snap&&snap[k]!==j)cur[k].u=now;delete S.del[k]}
  if(snap)for(const k in snap)if(!(k in cur))S.del[k]=now;
  for(const k in S.del)if(now-S.del[k]>90*864e5)delete S.del[k];
  snap=ns}
function resetSnap(){snap=null;stamp()}
function merge(L,R){const a=recs(L),b=recs(R),del={...(R.del||{})};for(const k in L.del||{})del[k]=Math.max(del[k]||0,L.del[k]);
  const pick={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{const x=a[k],y=b[k];const w=!x?y:!y?x:((y.u||0)>(x.u||0)?y:x);if(del[k]&&del[k]>=(w.u||0))return;pick[k]=w});
  const order=(arr,pre)=>{const ids=arr.map(o=>o.id);Object.keys(pick).filter(k=>k.startsWith(pre)).forEach(k=>{const id=k.slice(2);if(!ids.includes(id))ids.push(id)});return ids.filter(id=>pick[pre+id]).map(id=>pick[pre+id])};
  const n={...L,classes:order(L.classes,'c:'),students:order(L.students,'s:'),pays:order(L.pays,'p:'),att:{},set:pick.set||L.set,del};
  for(const k in pick)if(k.startsWith('a:'))n.att[k.slice(2)]=pick[k];
  return n}

function loadGIS(){if(window.google&&google.accounts)return Promise.resolve();if(gisP)return gisP;
  gisP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=ok;s.onerror=()=>{gisP=null;no(new Error('Không tải được Google, kiểm tra mạng'))};document.head.appendChild(s)});return gisP}
async function getToken(){await loadGIS();return new Promise((ok,no)=>{
  const c=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPE,
    callback:r=>{if(r.error)return no(new Error(r.error));tok=r.access_token;tokExp=Date.now()+(+r.expires_in||3600)*1000;ok()},
    error_callback:e=>no(new Error(e&&e.type==='popup_closed'?'Đã đóng cửa sổ đăng nhập':'Không đăng nhập được Google'))});
  c.requestAccessToken({prompt:SC.email?'':'consent',login_hint:SC.email||undefined})})}
async function gapi(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});
  if(r.status===401){tok=null;throw new Error('Phiên đăng nhập Google đã hết, bấm Đồng bộ để đăng nhập lại')}
  if(!r.ok)throw new Error('Google Drive báo lỗi '+r.status);return r}
async function findFile(){const q=encodeURIComponent(`name='${SYNC_FILE}' and trashed=false`);const j=await(await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`)).json();return j.files&&j.files[0]?j.files[0].id:''}

  if(SC.fileId){await gapi(`https://www.googleapis.com/upload/drive/v3/files/${SC.fileId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:txt});return}
  const bd='solop'+Date.now(),meta={name:SYNC_FILE,mimeType:'application/json',description:'Dữ liệu Sổ Lớp (đã mã hóa). Đừng xóa file này nếu đang dùng đồng bộ.'};
  const j=await(await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},
    body:`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${txt}\r\n--${bd}--`})).json();SC.fileId=j.id;saveSC()}
const SHARED=st=>{const{pin,lastBackup,seen,savedAt,...r}=st;return r};   // không đồng bộ PIN và thông tin riêng của từng máy
async function syncNow(interactive){
  if(!GOOGLE_CLIENT_ID||!SC.on||syncing)return;
  if(!tokOK()){if(!interactive){syncErr='need';updSync();return}try{await getToken()}catch(e){syncErr=e.message;updSync();if(interactive)toast(e.message);return}}
  syncing=true;syncErr='';updSync();
  try{
    if(!SC.email){try{const a=await(await gapi('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json();SC.email=a.user.emailAddress;saveSC()}catch(e){}}
    if(!SC.fileId)SC.fileId=await findFile();
    let remote=null;
    if(SC.fileId){const r=await gapi(`https://www.googleapis.com/drive/v3/files/${SC.fileId}?alt=media`).catch(e=>{if(/404/.test(e.message)){SC.fileId='';return null}throw e});
      if(r){const o=await r.json();try{remote=JSON.parse(await decrypt(o,SC.pass))}catch(e){throw new Error('Mật khẩu đồng bộ không khớp với dữ liệu đã có trên Google Drive')}}}
    stamp();
    if(remote){const keepLocal={pin:S.pin,lastBackup:S.lastBackup,seen:S.seen};S=normalize({...merge(S,remote),...keepLocal});}
    const txt=JSON.stringify(S);try{localStorage.setItem(LS,txt)}catch(e){}await dbPut(txt);resetSnap();
    await upload({app:'so-lop',v:3,at:new Date().toISOString(),...(await encrypt(JSON.stringify(SHARED(S)),SC.pass))});
    SC.last=Date.now();saveSC();if(!shOpen)render();
  }catch(e){syncErr=e.message;if(interactive)toast(e.message)}
  syncing=false;updSync()}
function queueSync(){if(!SC.on||!tokOK())return updSync();clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),4000)}
function ago(t){const s=(Date.now()-t)/1000;return s<60?'vừa xong':s<3600?Math.floor(s/60)+' phút trước':s<86400?Math.floor(s/3600)+' giờ trước':new Date(t).toLocaleDateString('vi-VN')}
function syncChip(){if(!GOOGLE_CLIENT_ID||!SC.on)return'';const t=syncing?'Đang đồng bộ…':syncErr==='need'?'Bấm để đồng bộ':syncErr?'Lỗi đồng bộ, bấm thử lại':'Đã đồng bộ '+ago(SC.last);
  return`<button class="schip ${syncErr?'warn':''}" data-a="syncnow">${ic('cloud')}<span>${t}</span></button>`}
function updSync(){$$('.schip').forEach(e=>e.outerHTML=syncChip())}
function syncForm(){if(GOOGLE_CLIENT_ID)loadGIS().catch(()=>{});if(!GOOGLE_CLIENT_ID)return sheet('<h3>Đồng bộ Google Drive</h3><p class="sub">Tính năng đang được cài đặt, sẽ có trong bản cập nhật tới.</p>');
  if(SC.on)return sheet(`<h3>Đồng bộ Google Drive</h3><div class="card ok">✓ Đang bật${SC.email?' · '+esc(SC.email):''}<br><small style="color:inherit">${SC.last?'Lần cuối: '+ago(SC.last):'Chưa đồng bộ lần nào'}</small></div>${syncErr&&syncErr!=='need'?`<p class="hint" style="color:var(--r)">${esc(syncErr)}</p>`:''}<button class="btn" data-a="syncnow">Đồng bộ ngay</button><button class="btn rd" data-a="syncoff">Tắt đồng bộ trên máy này</button><p class="hint">Tắt đồng bộ: dữ liệu trên máy này vẫn giữ nguyên, file trên Drive cũng không bị xóa.</p>`);
  sheet(`<h3>Đồng bộ Google Drive</h3><p class="sub">Dùng chung dữ liệu giữa điện thoại và máy tính. Dữ liệu được <b>mã hóa trên máy</b> rồi lưu vào <b>Google Drive của chính ${esc(S.set.xung)}</b>. Google và Đ-LAB đều không đọc được.</p>
  <label>Mật khẩu đồng bộ (ít nhất 8 ký tự)<input id="sp1" type="password" autocomplete="new-password"></label><label>Nhập lại mật khẩu<input id="sp2" type="password" autocomplete="new-password"></label>
  <p class="hint">⚠️ <b>Dùng cùng một mật khẩu trên mọi máy.</b> Quên mật khẩu là không mở được dữ liệu trên Drive (vẫn còn dữ liệu trên từng máy). Hãy ghi mật khẩu ra giấy và cất kỹ.</p>
  <button class="btn" data-a="syncon">Đăng nhập Google & bật đồng bộ</button><p class="hint">App chỉ xin quyền truy cập <b>đúng file do Sổ Lớp tạo</b>, không xem được các file khác trong Drive.</p>`)}

/* ---------- Khởi động ---------- */
(async()=>{await load();resetSnap();if(SC.on){syncErr='need';loadGIS().catch(()=>{})}document.title=S.set.title;if(S.pin&&typeof S.pin!=='object')S.pin=null;lock();render();
  try{if(navigator.storage&&navigator.storage.persisted)persisted=await navigator.storage.persisted()}catch(e){}
  if(S.students.length)askPersist();
  if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  setInterval(()=>{if(tab==='home'&&!shOpen&&!document.hidden&&!qHome&&document.activeElement.tagName!=='INPUT')render()},60000);
})();
</script>
